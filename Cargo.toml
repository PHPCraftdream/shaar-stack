# Sha'ar Stack Cargo workspace.
[workspace]
resolver = "3"
members = [
    "crates/shaar",
    "crates/shaar-ygg",
    "crates/shaar-p2p",
    "crates/shaar-server",
    "crates/shaar-client",
    "crates/shaar-platform",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[patch.crates-io]
hickory-resolver = { path = "target/p2p/resolver/hickory-resolver-0.26.3" }
libp2p-dns = { path = "target/p2p/dns/libp2p-dns-0.45.0" }
libp2p-kad = { path = "target/p2p/kad/libp2p-kad-0.49.0" }
libp2p-relay = { path = "target/p2p/relay/libp2p-relay-0.22.0" }
libp2p-swarm = { path = "target/p2p/swarm/libp2p-swarm-0.48.0" }
noq-proto = { path = "target/backend/noq-proto/noq-proto-1.3.0" }
iroh = { path = "target/backend/iroh/iroh-1.3.0" }
noq = { path = "target/backend/noq/noq-1.3.0" }
