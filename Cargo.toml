# Sha'ar Stack Cargo workspace.
[workspace]
exclude = ["target/native-graph/adapter/iroh-mainline-address-lookup", "crates/shaar-ygg-core", "target/ygg/Yggdrasil-ng-c9a54f1587bb133a06072596484c972a336db0d2"]
resolver = "3"
members = [
    "crates/shaar",
    "crates/shaar-ygg",
    "crates/shaar-p2p",
    "crates/shaar-server",
    "crates/shaar-client",
    "crates/shaar-platform",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[patch.crates-io]
hickory-resolver = { path = "target/p2p/resolver/hickory-resolver-0.26.3" }
libp2p-dns = { path = "target/p2p/dns/libp2p-dns-0.45.0" }
libp2p-kad = { path = "target/p2p/kad/libp2p-kad-0.49.0" }
simple-dns = { path = "target/p2p/simple-dns/simple-dns-0.12.0" }
libp2p-relay = { path = "target/p2p/relay/libp2p-relay-0.22.0" }
n0-mainline = { path = "target/native-graph/n0-mainline-0.7.0" }
n0-future = { path = "target/native-graph/n0-future-0.3.2" }
serde_bencode = { path = "target/native-graph/serde_bencode-0.2.4" }
iroh-dns = { path = "target/native-graph/iroh-dns-1.3.0" }
multibase = { path = "target/native-graph/multibase-0.9.3" }
libp2p-swarm = { path = "target/p2p/swarm/libp2p-swarm-0.48.0" }
noq-proto = { path = "target/backend/noq-proto/noq-proto-1.3.0" }
iroh = { path = "target/backend/iroh/iroh-1.3.0" }
noq = { path = "target/backend/noq/noq-1.3.0" }
