# Sha'ar Stack SDK.
[package]
name = "shaar"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[test]]
name = "native_graph_witness"
path = "../../.github/probes/native-graph/fixture/witness.rs"

[dependencies]
futures = "=0.3.34"
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring", "unstable-custom-transports"] }
shaar-ygg = { path = "../shaar-ygg" }
shaar-p2p = { path = "../shaar-p2p" }
ktav = "=0.8.1"
iroh-base = { version = "=1.3.0", default-features = false, features = ["key"] }
iroh-dns = "=1.3.0"
iroh-mainline-address-lookup = { version = "=0.6.1", path = "../../target/native-graph/adapter/iroh-mainline-address-lookup" }
n0-mainline = "=0.7.0"
simple-dns = "=0.12.0"
serde = { version = "=1.0.229", features = ["derive"] }
tokio = { version = "=1.54.1", features = ["fs", "io-util", "rt", "sync", "time", "net", "macros"] }
zeroize = "=1.9.1"
# L3b sealed address (owner approval 2026-11-16): authorized already-locked edges, no new package or version.
# `alloc` only: the random salt comes from the identity generator, so no getrandom edge is enabled.
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc"] }
hkdf = "=0.13.0"
sha2 = "=0.11.1"
libp2p-identity = { version = "=0.3.0", default-features = false, features = ["ed25519", "peerid"] }

# Same URL parser the pinned Yggdrasil backend uses; composed peer URIs are
# validated against its exact parsing and decoding semantics. Authorized
# already-locked edge: no new package or version (url 2.5.8).
url = "=2.5.8"

# The DHT library's query counters reach the operator trace (leaf FIX-3b). Already-locked edge:
# no new package or version (tracing 0.1.44 was a dev dependency of this package).
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }

# The home router of this machine, whose mapping port the port mapping asks (leaf PORT-1). Already-locked
# edge: no new package or version (netwatch 0.19.3 was a dev dependency of this package; iroh uses it).
netwatch = "=0.19.3"

[target.'cfg(windows)'.dependencies]
shaar-platform = { path = "../shaar-platform" }

[dev-dependencies]
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring", "unstable-custom-transports", "shaar-native-gate"] }
serde_bencode = "=0.2.4"
tracing-subscriber = { version = "=0.3.20", default-features = false, features = ["fmt", "registry"] }
libp2p = { version = "=0.57.1", default-features = false, features = ["ed25519", "tokio", "tcp", "noise", "yamux", "relay"] }
n0-future = "=0.3.2"
tokio-util = { version = "=0.7.20", features = ["rt"] }
# Multi-thread execution and deterministic test coordination only.
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "process", "test-util"] }
