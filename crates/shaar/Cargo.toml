# Sha'ar Stack SDK.
[package]
name = "shaar"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring", "unstable-custom-transports"] }
shaar-ygg = { path = "../shaar-ygg" }
shaar-p2p = { path = "../shaar-p2p" }
ktav = "=0.8.0"
iroh-base = { version = "=1.3.0", default-features = false, features = ["key"] }
serde = { version = "=1.0.229", features = ["derive"] }
tokio = { version = "=1.54.1", features = ["fs", "io-util", "rt"] }
zeroize = "=1.9.1"

[target.'cfg(windows)'.dependencies]
shaar-platform = { path = "../shaar-platform" }

[dev-dependencies]
libp2p-identity = { version = "=0.3.0", default-features = false, features = ["ed25519", "peerid"] }
# Multi-thread execution and deterministic test coordination only.
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "sync", "time", "net"] }
