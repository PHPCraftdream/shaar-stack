# Product-graph entry to the Yggdrasil adapter. The adapter itself lives in the
# standalone nested crate `shaar-ygg-core` (pinned, lifecycle-patched core).
[package]
name = "shaar-ygg"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
shaar-ygg-core = { path = "../shaar-ygg-core" }
tokio = { version = "=1.54.1", features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["rt", "macros", "time", "net"] }
