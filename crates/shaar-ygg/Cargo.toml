# Product-graph entry to the Yggdrasil adapter. The adapter itself lives in the
# standalone nested crate `shaar-ygg-core` (pinned, lifecycle-patched core).
[package]
name = "shaar-ygg"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
shaar-ygg-core = { path = "../shaar-ygg-core" }
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring", "unstable-custom-transports"] }
iroh-base = { version = "=1.3.0", default-features = false, features = ["key"] }
n0-watcher = "=1.0.0"
noq-udp = "=1.3.0"
tokio = { version = "=1.54.1", features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["rt", "macros", "time", "net"] }
