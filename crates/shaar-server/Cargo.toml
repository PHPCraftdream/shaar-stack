# Sha'ar Stack server.
[package]
name = "shaar-server"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
shaar = { path = "../shaar" }
iroh-base = { version = "=1.3.0", default-features = false, features = ["key"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "signal", "fs", "io-util", "time", "sync", "net"] }
