# Sha'ar Stack client.
[package]
name = "shaar-client"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
shaar = { path = "../shaar" }
clap = { version = "=4.6.8", default-features = false, features = ["std", "help", "usage", "error-context"] }
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "net", "io-util", "signal", "time", "fs"] }
