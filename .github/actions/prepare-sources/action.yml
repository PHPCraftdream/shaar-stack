name: Prepare reviewed product sources
inputs:
  selection:
    description: Validated CI domain flags
    required: true
  resolve_only:
    description: Prepare all sources but skip locked product metadata checks for candidate resolution
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Prepare native graph source archives
      shell: bash
      run: |
        set -euo pipefail
        source .github/actions/prepare-sources/capture.sh native-graph
        mkdir -p target/native-graph-archives
        curl --fail --location --max-time 120 --max-filesize 2097152 https://codeload.github.com/n0-computer/iroh-address-lookups/tar.gz/0f5f547cc65514e4537d4e66f776319ea8e30a2e --output target/native-graph-archives/adapter-source.tar.gz
        curl --fail --location --max-time 120 --max-filesize 16777216 https://static.crates.io/crates/n0-mainline/n0-mainline-0.7.0.crate --output target/native-graph-archives/n0-mainline-0.7.0.crate
        curl --fail --location --max-time 120 --max-filesize 2097152 https://static.crates.io/crates/n0-future/n0-future-0.3.2.crate --output target/native-graph-archives/n0-future-0.3.2.crate
        curl --fail --location --max-time 120 --max-filesize 2097152 https://static.crates.io/crates/serde_bencode/serde_bencode-0.2.4.crate --output target/native-graph-archives/serde_bencode-0.2.4.crate
        curl --fail --location --max-time 120 --max-filesize 16777216 https://static.crates.io/crates/iroh-dns/iroh-dns-1.3.0.crate --output target/native-graph-archives/iroh-dns-1.3.0.crate
        curl --fail --location --max-time 120 --max-filesize 2097152 https://static.crates.io/crates/multibase/multibase-0.9.3.crate --output target/native-graph-archives/multibase-0.9.3.crate
        python -I .github/probes/native-graph/prepare.py --adapter-archive target/native-graph-archives/adapter-source.tar.gz --mainline-archive target/native-graph-archives/n0-mainline-0.7.0.crate --future-archive target/native-graph-archives/n0-future-0.3.2.crate --bencode-archive target/native-graph-archives/serde_bencode-0.2.4.crate --dns-archive target/native-graph-archives/iroh-dns-1.3.0.crate --multibase-archive target/native-graph-archives/multibase-0.9.3.crate --destination target/native-graph
    - name: Prepare reviewed Yggdrasil-ng core sources
      shell: bash
      run: |
        set -euo pipefail
        source .github/actions/prepare-sources/capture.sh ygg
        mkdir -p target/ygg-archives
        curl --fail --location --max-time 120 --max-filesize 33554432 https://codeload.github.com/Revertron/Yggdrasil-ng/tar.gz/c9a54f1587bb133a06072596484c972a336db0d2 --output target/ygg-archives/yggdrasil-ng.tar.gz
        python -I .github/probes/ygg/prepare.py prepare --archive target/ygg-archives/yggdrasil-ng.tar.gz --destination target/ygg
        python -I .github/probes/ygg/checks.py target/ygg-archives/yggdrasil-ng.tar.gz
        cp target/ygg/Yggdrasil-ng-c9a54f1587bb133a06072596484c972a336db0d2.provenance.json target/native-graph-preparation-logs/ygg.provenance.json
        if [[ "${{ inputs.resolve_only }}" == "true" ]]; then
          cargo generate-lockfile --manifest-path crates/shaar-ygg-core/Cargo.toml
          cp crates/shaar-ygg-core/Cargo.lock target/native-graph-preparation-logs/ygg-core.Cargo.lock.candidate
        fi
    - name: Prepare reviewed production backend sources
      shell: bash
      run: |
        set -euo pipefail
        source .github/actions/prepare-sources/capture.sh backend
        mkdir -p target/backend-archives/noq target/backend-archives/iroh target/backend-archives/runtime
        curl --fail --location --max-time 120 \
          https://static.crates.io/crates/noq-proto/noq-proto-1.3.0.crate \
          --output target/backend-archives/noq/noq-proto.crate
        curl --fail --location --max-time 120 \
          https://static.crates.io/crates/iroh/iroh-1.3.0.crate \
          --output target/backend-archives/iroh/iroh.crate
        curl --fail --location --max-time 120 \
          https://static.crates.io/crates/noq/noq-1.3.0.crate \
          --output target/backend-archives/runtime/noq.crate
        python -I .github/scripts/backend/prepare.py \
          --noq-archive target/backend-archives/noq/noq-proto.crate \
          --iroh-archive target/backend-archives/iroh/iroh.crate \
          --runtime-archive target/backend-archives/runtime/noq.crate \
          --lock .github/probes/iroh-paths/Cargo.lock --destination target/backend
    - name: Prepare reviewed strict DNS parser dependency
      shell: bash
      run: |
        set -euo pipefail
        source .github/actions/prepare-sources/capture.sh simple-dns
        mkdir -p target/p2p/simple-dns-archive
        curl --fail --location --max-time 120 --max-filesize 2097152 https://static.crates.io/crates/simple-dns/simple-dns-0.12.0.crate --output target/p2p/simple-dns-archive/simple-dns.crate
        python -I .github/scripts/p2p/discovery/simple_dns/prepare.py prepare --archive target/p2p/simple-dns-archive/simple-dns.crate --destination target/p2p/simple-dns
        python -I .github/scripts/p2p/discovery/simple_dns/checks.py target/p2p/simple-dns-archive/simple-dns.crate
        python -I .github/scripts/p2p/discovery/simple_dns/graph_checks.py
    - name: Prepare reviewed signaling dependencies and expiry controls
      shell: bash
      run: |
        set -euo pipefail
        source .github/actions/prepare-sources/capture.sh relay
        mkdir -p target/p2p/relay-archive target/p2p/swarm-archive
        curl --fail --location --max-time 120 --max-filesize 2097152 https://static.crates.io/crates/libp2p-relay/libp2p-relay-0.22.0.crate --output target/p2p/relay-archive/relay.crate
        curl --fail --location --max-time 120 --max-filesize 2097152 https://static.crates.io/crates/libp2p-swarm/libp2p-swarm-0.48.0.crate --output target/p2p/swarm-archive/swarm.crate
        python -I .github/scripts/p2p/prepare.py --archive target/p2p/relay-archive/relay.crate --destination target/p2p/relay --swarm-archive target/p2p/swarm-archive/swarm.crate --swarm-destination target/p2p/swarm
        if ${{ fromJSON(inputs.selection).relay }}; then
          python -I .github/scripts/p2p/checks.py
          if [[ "$RUNNER_OS" == Windows ]]; then binary="$RUNNER_TEMP/p2p-lease.exe"; else binary="$RUNNER_TEMP/p2p-lease"; fi
          rustc --edition 2024 --test -D warnings .github/scripts/p2p/lease.rs -o "$binary"
          "$binary"
        fi
    - name: Prepare reviewed DNS expansion boundary
      shell: bash
      run: |
        set -euo pipefail
        source .github/actions/prepare-sources/capture.sh dns
        mkdir -p target/p2p/dns-archive
        curl --fail --location --max-time 120 --max-filesize 2097152 https://static.crates.io/crates/libp2p-dns/libp2p-dns-0.45.0.crate --output target/p2p/dns-archive/dns.crate
        python -I .github/scripts/p2p/discovery/dns/prepare.py prepare --archive target/p2p/dns-archive/dns.crate --destination target/p2p/dns
        if ${{ fromJSON(inputs.selection).dns }}; then
          python -I .github/scripts/p2p/discovery/dns/checks.py
          python -I .github/scripts/p2p/discovery/dns/prepare.py fixture --source target/p2p/dns/libp2p-dns-0.45.0 --destination target/dns-retention/libp2p-dns-0.45.0
        fi
    - name: Prepare reviewed resolver locking boundary
      shell: bash
      run: |
        set -euo pipefail
        source .github/actions/prepare-sources/capture.sh resolver
        mkdir -p target/p2p/resolver-archive
        curl --fail --location --max-time 120 --max-filesize 2097152 https://static.crates.io/crates/hickory-resolver/hickory-resolver-0.26.3.crate --output target/p2p/resolver-archive/resolver.crate
        script=.github/scripts/p2p/discovery/resolver
        python -I "$script/prepare.py" --archive target/p2p/resolver-archive/resolver.crate --destination target/p2p/resolver
        if ${{ fromJSON(inputs.selection).resolver }}; then
          rustfmt --edition 2021 --config skip_children=true --check "$script/tests/connections.rs" "$script/tests/cleanup.rs" "$script"/tests/cache/*.rs
          python -I "$script/checks.py"
          python -I "$script/tests/cache/checks.py"
          python -I "$script/fixture.py" --source target/p2p/resolver/hickory-resolver-0.26.3 --destination target/resolver-locking-archive
          for mechanism in connections cleanup cache_constructor cache_positive cache_error cache_alias cache_storage; do
            python -I "$script/fixture.py" --source target/p2p/resolver/hickory-resolver-0.26.3 --destination "target/resolver-locking-counterfactual-$mechanism" --counterfactual "$mechanism"
          done
        fi
    - name: Prepare reviewed Kademlia referral retention
      shell: bash
      run: |
        set -euo pipefail
        source .github/actions/prepare-sources/capture.sh kad
        mkdir -p target/p2p/kad-archive
        curl --fail --location --max-time 120 --max-filesize 2097152 https://static.crates.io/crates/libp2p-kad/libp2p-kad-0.49.0.crate --output target/p2p/kad-archive/kad.crate
        python -I .github/scripts/p2p/discovery/kad/kad.py prepare --archive target/p2p/kad-archive/kad.crate --destination target/p2p/kad
        if ${{ fromJSON(inputs.selection).kad }}; then
          python -I .github/scripts/p2p/discovery/kad/kad_checks.py
          python -I .github/scripts/p2p/discovery/kad/kad.py fixture --source target/p2p/kad/libp2p-kad-0.49.0 --destination target/kad-retention/libp2p-kad-0.49.0
        fi
        if [[ "${{ inputs.resolve_only }}" != "true" ]]; then
          cargo metadata --locked --format-version 1 > target/p2p/metadata.json
          python -I .github/scripts/p2p/graph.py verify --workspace . --baseline Cargo.lock --metadata target/p2p/metadata.json --relay-source target/p2p/relay/libp2p-relay-0.22.0 --swarm-source target/p2p/swarm/libp2p-swarm-0.48.0 --kad-source target/p2p/kad/libp2p-kad-0.49.0 --dns-source target/p2p/dns/libp2p-dns-0.45.0 --resolver-source target/p2p/resolver/hickory-resolver-0.26.3 --simple-dns-source target/p2p/simple-dns/simple-dns-0.12.0 --receipt target/p2p/graph-receipt.json
        fi
        if [[ "${{ inputs.resolve_only }}" != "true" ]]; then
          if [[ "$RUNNER_OS" == Windows ]]; then host=x86_64-pc-windows-msvc; else host=x86_64-unknown-linux-gnu; fi
          cargo metadata --locked --format-version 1 --filter-platform "$host" > target/resolver-locking-baseline.json
        fi
