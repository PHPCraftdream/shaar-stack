name: noq payload gate spike

on:
  push:
    branches: [develop]
    paths:
      - ".github/probes/iroh-paths/gate/**"
      - ".github/scripts/backend/**"
      - ".github/workflows/noq-gate.yml"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/probes/iroh-paths/gate/**"
      - ".github/scripts/backend/**"
      - ".github/workflows/noq-gate.yml"

permissions:
  contents: read

concurrency:
  group: noq-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt
          rustup override set 1.99.1
      - name: Prepare checksum-pinned source (data only)
        run: |
          set -euo pipefail
          mkdir -p target/noq-gate/archive
          curl --fail --location --max-time 120 \
            https://static.crates.io/crates/noq-proto/noq-proto-1.3.0.crate \
            --output target/noq-gate/archive/noq-proto.crate
          python3 -I .github/probes/iroh-paths/gate/prepare.py \
            --archive target/noq-gate/archive/noq-proto.crate \
            --lock .github/probes/iroh-paths/Cargo.lock \
            --destination target/noq-gate/source
      - name: Format generated source and run initial gate regressions
        run: |
          set -euo pipefail
          manifest=target/noq-gate/source/noq-proto-1.3.0/Cargo.toml
          cargo fmt --manifest-path "$manifest" --all
          cargo test --manifest-path "$manifest" --locked --lib payload_policy -- --nocapture
      - name: Run upstream backend regression suite with default behavior preserved
        run: |
          cargo test --manifest-path target/noq-gate/source/noq-proto-1.3.0/Cargo.toml --locked --lib
      - name: Upload exact backend lock and policy test source
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: noq-gate-evidence-${{ matrix.os }}
          path: |
            target/noq-gate/source/noq-proto-1.3.0/Cargo.lock
            target/noq-gate/source/noq-proto-1.3.0/src/tests/payload_policy.rs
            target/noq-gate/source/noq-proto-1.3.0/src/tests/payload_policy_resources.rs
            target/noq-gate/source/noq-proto-1.3.0/src/connection/payload_policy_bounds.rs
          if-no-files-found: warn
