name: SDK lockfile preparation

on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Reviewed candidate commit in this repository
        required: true
        type: string
      direct_feedback:
        description: Run the reviewed process lifecycle cases instead of resolving a lockfile
        required: false
        type: boolean
        default: false
      controlled_network_preflight:
        description: Inspect preinstalled network tools without root, product builds or lock generation
        required: false
        type: boolean
        default: false
      controlled_network_matrix:
        description: Run one group of bounded privileged product cases and the cleanup controls on this disposable runner
        required: false
        type: boolean
        default: false
      controlled_network_group:
        description: Case group of the privileged matrix (base, nat or faults); used only with controlled_network_matrix
        required: false
        type: choice
        options:
          - base
          - nat
          - faults
        default: base
      public_smoke:
        description: Bounded live smoke over public networks (needs a recorded approval, a pinned relay and the contract digest below)
        required: false
        type: boolean
        default: false
      public_smoke_contract_sha256:
        description: SHA-256 of .github/probes/public-smoke/contract.json at source_revision
        required: false
        type: string
        default: ''
      resource_measurement:
        description: Run the bounded P14 loopback resource measurement of release products (no lock, no public network)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  resolve:
    if: ${{ !inputs.direct_feedback && !inputs.controlled_network_preflight && !inputs.controlled_network_matrix && !inputs.resource_measurement && !inputs.public_smoke }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUSTUP_TOOLCHAIN: "1.99.1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_revision }}
          persist-credentials: false
      - name: Install the pinned resolver toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Record the source revision
        run: git rev-parse HEAD
      - name: Resolve the canonical workspace lockfile
        id: resolve
        run: cargo generate-lockfile
      - name: Retain the successfully resolved text lockfile
        if: ${{ success() && steps.resolve.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-cargo-lock
          path: Cargo.lock
          if-no-files-found: error

  direct-feedback:
    if: ${{ inputs.direct_feedback && !inputs.controlled_network_preflight && !inputs.controlled_network_matrix && !inputs.public_smoke }}
    name: Process feedback (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: "1.99.1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_revision }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install Rust 1.99.1
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      - name: Structural limits
        run: python -I -X utf8 .github/scripts/check_structure.py
      - name: Structural guard tests
        run: python -I -X utf8 -m unittest discover -s .github/scripts/tests
      - name: Prepare current reviewed product sources without lock generation
        uses: ./.github/actions/prepare-sources
        with:
          selection: '{"relay": false, "dns": false, "resolver": false, "kad": false}'
          resolve_only: "false"
      - name: cargo fmt
        shell: bash
        run: |
          cargo fmt -p shaar -p shaar-ygg -p shaar-p2p -p shaar-server -p shaar-client -p shaar-platform -- --check
          cargo fmt --manifest-path crates/shaar-ygg-core/Cargo.toml -- --check
      - name: Scoped all-target clippy
        run: cargo clippy -p shaar -p shaar-server -p shaar-client --all-targets --locked -- -D warnings
      - name: Verify reviewed process lifecycle cases and binary provenance
        run: python -I .github/ci/run.py process-feedback
      - name: Preserve direct-process execution and preparation receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: direct-process-${{ matrix.os }}
          path: |
            target/ci-process/
            target/native-graph-preparation-logs/
            target/p2p/graph-receipt.json
          if-no-files-found: error

  controlled-network-tools:
    if: ${{ inputs.controlled_network_preflight }}
    name: Network tools only (unprivileged; not product proof)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate exclusive tool preflight and source
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
          DIRECT_FEEDBACK: ${{ inputs.direct_feedback }}
        run: |
          python3 -I - <<'PYTHON'
          import os
          import re
          if os.environ["DIRECT_FEEDBACK"] != "false":
              raise SystemExit("tool preflight excludes product and lock modes")
          if not re.fullmatch(r"[0-9a-f]{40}", os.environ["SOURCE_REVISION"]):
              raise SystemExit("source_revision must be an exact reviewed 40-hex SHA")
          PYTHON
      - name: Checkout tool preflight source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.source_revision }}
          persist-credentials: false
      - name: Inspect preinstalled tools without privilege
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: python3 -I .github/probes/nat-topology/quic/product/preflight.py --source "$SOURCE_REVISION"
      - name: Preserve tool-only preflight report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: controlled-network-tools
          path: target/controlled-network-tools/report.json
          if-no-files-found: error

  controlled-network-matrix:
    if: ${{ inputs.controlled_network_matrix && !inputs.controlled_network_preflight && !inputs.direct_feedback }}
    name: Controlled NAT matrix (privileged namespaces; disposable runner only)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: "1.99.1"
    steps:
      - name: Validate exclusive controlled-network request and source
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
          DIRECT_FEEDBACK: ${{ inputs.direct_feedback }}
          PREFLIGHT: ${{ inputs.controlled_network_preflight }}
        run: |
          python3 -I - <<'PYTHON'
          import os
          import re
          if os.environ["DIRECT_FEEDBACK"] != "false" or os.environ["PREFLIGHT"] != "false":
              raise SystemExit("the privileged matrix excludes lock, process and tool-preflight modes")
          if not re.fullmatch(r"[0-9a-f]{40}", os.environ["SOURCE_REVISION"]):
              raise SystemExit("source_revision must be an exact reviewed 40-hex SHA")
          PYTHON
      - name: Checkout the exact reviewed source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_revision }}
          persist-credentials: false
      - name: Verify checked-out source revision
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install Rust 1.99.1
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Prepare current reviewed product sources without lock generation
        uses: ./.github/actions/prepare-sources
        with:
          selection: '{"relay": false, "dns": false, "resolver": false, "kad": false}'
          resolve_only: "false"
      - name: Compile normal products and record provenance without privilege
        run: python -I .github/ci/run.py product-manifest
      - name: Inspect preinstalled network tools without privilege
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: python -I .github/probes/nat-topology/quic/product/preflight.py --source "$SOURCE_REVISION"
      - name: Run the bounded privileged phase (the only step using sudo)
        timeout-minutes: 22
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
          MATRIX_GROUP: ${{ inputs.controlled_network_group }}
        run: |
          set -euo pipefail
          sudo -n true
          sudo -n -E env PATH="$PATH" "$(command -v python)" -I .github/probes/nat-topology/quic/product/runtime/phase.py \
            --source "$SOURCE_REVISION" --manifest "$PWD/target/ci-product/manifest.json" --group "$MATRIX_GROUP"
      - name: Preserve controlled-network evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: controlled-network-matrix
          path: |
            .github/probes/nat-topology/out/
            target/ci-product/manifest.json
            target/ci-product/products.build.stderr
            target/controlled-network-tools/report.json
          if-no-files-found: error

  public-smoke-plan:
    if: ${{ inputs.public_smoke }}
    name: Public smoke plan (validation only; no public network contact)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate the exact dispatch inputs
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
          CONTRACT_SHA256: ${{ inputs.public_smoke_contract_sha256 }}
          DIRECT_FEEDBACK: ${{ inputs.direct_feedback }}
          PREFLIGHT: ${{ inputs.controlled_network_preflight }}
          MATRIX: ${{ inputs.controlled_network_matrix }}
        run: |
          python3 -I - <<'PYTHON'
          import os
          import re
          if not re.fullmatch(r"[0-9a-f]{40}", os.environ["SOURCE_REVISION"]):
              raise SystemExit("source_revision must be an exact reviewed 40-hex SHA")
          if os.environ["GITHUB_RUN_ATTEMPT"] != "1":
              raise SystemExit("re-running is forbidden: one run per dispatch")
          if any(os.environ[name] != "false" for name in ("DIRECT_FEEDBACK", "PREFLIGHT", "MATRIX")):
              raise SystemExit("the public smoke excludes the other dispatch modes")
          if not re.fullmatch(r"[0-9a-f]{64}", os.environ["CONTRACT_SHA256"]):
              raise SystemExit("public_smoke_contract_sha256 must be 64 lowercase hex characters")
          PYTHON
      - name: Checkout the exact reviewed source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_revision }}
          persist-credentials: false
      - name: Verify checked-out source revision
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Unit-test the smoke harness (pure; no network)
        run: python -I -m unittest discover -s .github/probes/public-smoke -p "test_*.py"
      - name: Validate the contract, recorded approval, relay target and meter availability
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
          CONTRACT_SHA256: ${{ inputs.public_smoke_contract_sha256 }}
          PUBLIC_SMOKE: ${{ inputs.public_smoke }}
          DIRECT_FEEDBACK: ${{ inputs.direct_feedback }}
          PREFLIGHT: ${{ inputs.controlled_network_preflight }}
          MATRIX: ${{ inputs.controlled_network_matrix }}
        run: python -I .github/probes/public-smoke/run.py validate

  public-smoke-build:
    needs: public-smoke-plan
    if: ${{ inputs.public_smoke }}
    name: Public smoke build (normal products, native gate OFF; no public network contact)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: "1.99.1"
    outputs:
      t0: ${{ steps.epoch.outputs.t0 }}
    steps:
      - name: Checkout the exact reviewed source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_revision }}
          persist-credentials: false
      - name: Verify checked-out source revision
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install Rust 1.99.1
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Prepare current reviewed product sources without lock generation
        uses: ./.github/actions/prepare-sources
        with:
          selection: '{"relay": false, "dns": false, "resolver": false, "kad": false}'
          resolve_only: "false"
      - name: Compile normal products and record provenance
        run: python -I .github/ci/run.py product-manifest
      - name: Stage the two products and their manifest (no keys, no configs)
        run: |
          python3 -I - <<'PYTHON'
          import json
          import pathlib
          import shutil
          manifest = json.loads(pathlib.Path("target/ci-product/manifest.json").read_text(encoding="utf-8"))
          stage = pathlib.Path("target/public-smoke/stage")
          stage.mkdir(parents=True)
          for name in ("shaar-server", "shaar-client"):
              shutil.copy2(manifest["products"][name]["executable"], stage / name)
          shutil.copy2("target/ci-product/manifest.json", stage / "manifest.json")
          PYTHON
      - name: Preserve the staged products for the two runners
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-smoke-binaries
          path: target/public-smoke/stage/
          retention-days: 1
          if-no-files-found: error
      - name: Fix the shared window origin (now plus a 90 s runner setup margin)
        id: epoch
        run: echo "t0=$(( $(date +%s) + 90 ))" >> "$GITHUB_OUTPUT"

  public-smoke-server:
    needs: public-smoke-build
    if: ${{ inputs.public_smoke }}
    name: Public smoke Server (runner A; single run)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout the exact reviewed source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_revision }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: public-smoke-binaries
          path: target/public-smoke/stage
      - name: Run the Server role under the enforced caps
        timeout-minutes: 5
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
          CONTRACT_SHA256: ${{ inputs.public_smoke_contract_sha256 }}
          PUBLIC_SMOKE: ${{ inputs.public_smoke }}
          DIRECT_FEEDBACK: ${{ inputs.direct_feedback }}
          PREFLIGHT: ${{ inputs.controlled_network_preflight }}
          MATRIX: ${{ inputs.controlled_network_matrix }}
          T0: ${{ needs.public-smoke-build.outputs.t0 }}
        run: |
          set -euo pipefail
          chmod 0700 target/public-smoke/stage/shaar-server
          python -I .github/probes/public-smoke/run.py server --manifest "$PWD/target/public-smoke/stage/manifest.json" \
            --bin "$PWD/target/public-smoke/stage/shaar-server" --workdir "$PWD/target/public-smoke/server-work" --t0 "$T0"
      - name: Preserve the Server evidence (no keys, no configs)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-smoke-server-evidence
          path: target/public-smoke/server-evidence/
          retention-days: 14
          if-no-files-found: warn

  public-smoke-client:
    needs: public-smoke-build
    if: ${{ inputs.public_smoke }}
    name: Public smoke Client (runner B; single run)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout the exact reviewed source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_revision }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: public-smoke-binaries
          path: target/public-smoke/stage
      - name: Run the Client role under the enforced caps
        timeout-minutes: 5
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
          CONTRACT_SHA256: ${{ inputs.public_smoke_contract_sha256 }}
          PUBLIC_SMOKE: ${{ inputs.public_smoke }}
          DIRECT_FEEDBACK: ${{ inputs.direct_feedback }}
          PREFLIGHT: ${{ inputs.controlled_network_preflight }}
          MATRIX: ${{ inputs.controlled_network_matrix }}
          T0: ${{ needs.public-smoke-build.outputs.t0 }}
        run: |
          set -euo pipefail
          chmod 0700 target/public-smoke/stage/shaar-client
          python -I .github/probes/public-smoke/run.py client --manifest "$PWD/target/public-smoke/stage/manifest.json" \
            --bin "$PWD/target/public-smoke/stage/shaar-client" --workdir "$PWD/target/public-smoke/client-work" --t0 "$T0"
      - name: Preserve the Client evidence (no keys, no configs)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-smoke-client-evidence
          path: target/public-smoke/client-evidence/
          retention-days: 14
          if-no-files-found: warn

  resource-budget:
    if: ${{ inputs.resource_measurement && !inputs.direct_feedback && !inputs.controlled_network_preflight && !inputs.controlled_network_matrix && !inputs.public_smoke }}
    name: P14 resource budgets (loopback only; release products)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      RUSTUP_TOOLCHAIN: "1.99.1"
    steps:
      - name: Validate exclusive resource request and source
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: |
          python3 -I - <<'PYTHON'
          import os
          import re
          if not re.fullmatch(r"[0-9a-f]{40}", os.environ["SOURCE_REVISION"]):
              raise SystemExit("source_revision must be an exact reviewed 40-hex SHA")
          PYTHON
      - name: Checkout the exact reviewed source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_revision }}
          persist-credentials: false
      - name: Verify checked-out source revision
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install Rust 1.99.1
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Prepare current reviewed product sources without lock generation
        uses: ./.github/actions/prepare-sources
        with:
          selection: '{"relay": false, "dns": false, "resolver": false, "kad": false}'
          resolve_only: "false"
      - name: Build release products and the harness binary (no execution)
        run: python -I .github/ci/run.py resource-build
      - name: Run the loopback measurement (at most 15 minutes, unprivileged, no public network)
        timeout-minutes: 16
        run: python -I .github/ci/run.py resource-run
      - name: Preserve resource measurement evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resource-budget
          path: target/ci-resources/
          if-no-files-found: error
