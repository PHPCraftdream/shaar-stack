name: SDK lockfile preparation

on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Reviewed candidate commit in this repository
        required: true
        type: string
      direct_feedback:
        description: Run the reviewed process lifecycle cases instead of resolving a lockfile
        required: false
        type: boolean
        default: false
      controlled_network_preflight:
        description: Inspect preinstalled network tools without root, product builds or lock generation
        required: false
        type: boolean
        default: false
      controlled_network_matrix:
        description: Run one group of bounded privileged product cases and the cleanup controls on this disposable runner
        required: false
        type: boolean
        default: false
      controlled_network_group:
        description: Case group of the privileged matrix (base, nat or faults); used only with controlled_network_matrix
        required: false
        type: choice
        options:
          - base
          - nat
          - faults
        default: base
      resource_measurement:
        description: Run the bounded P14 loopback resource measurement of release products (no lock, no public network)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  resolve:
    if: ${{ !inputs.direct_feedback && !inputs.controlled_network_preflight && !inputs.controlled_network_matrix && !inputs.resource_measurement }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUSTUP_TOOLCHAIN: "1.99.1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_revision }}
          persist-credentials: false
      - name: Install the pinned resolver toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Record the source revision
        run: git rev-parse HEAD
      - name: Resolve the canonical workspace lockfile
        id: resolve
        run: cargo generate-lockfile
      - name: Retain the successfully resolved text lockfile
        if: ${{ success() && steps.resolve.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-cargo-lock
          path: Cargo.lock
          if-no-files-found: error

  direct-feedback:
    if: ${{ inputs.direct_feedback && !inputs.controlled_network_preflight && !inputs.controlled_network_matrix }}
    name: Process feedback (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: "1.99.1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_revision }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install Rust 1.99.1
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      - name: Structural limits
        run: python -I -X utf8 .github/scripts/check_structure.py
      - name: Structural guard tests
        run: python -I -X utf8 -m unittest discover -s .github/scripts/tests
      - name: Prepare current reviewed product sources without lock generation
        uses: ./.github/actions/prepare-sources
        with:
          selection: '{"relay": false, "dns": false, "resolver": false, "kad": false}'
          resolve_only: "false"
      - name: cargo fmt
        shell: bash
        run: |
          cargo fmt -p shaar -p shaar-ygg -p shaar-p2p -p shaar-server -p shaar-client -p shaar-platform -- --check
          cargo fmt --manifest-path crates/shaar-ygg-core/Cargo.toml -- --check
      - name: Scoped all-target clippy
        run: cargo clippy -p shaar -p shaar-server -p shaar-client --all-targets --locked -- -D warnings
      - name: Verify reviewed process lifecycle cases and binary provenance
        run: python -I .github/ci/run.py process-feedback
      - name: Preserve direct-process execution and preparation receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: direct-process-${{ matrix.os }}
          path: |
            target/ci-process/
            target/native-graph-preparation-logs/
            target/p2p/graph-receipt.json
          if-no-files-found: error

  controlled-network-tools:
    if: ${{ inputs.controlled_network_preflight }}
    name: Network tools only (unprivileged; not product proof)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate exclusive tool preflight and source
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
          DIRECT_FEEDBACK: ${{ inputs.direct_feedback }}
        run: |
          python3 -I - <<'PYTHON'
          import os
          import re
          if os.environ["DIRECT_FEEDBACK"] != "false":
              raise SystemExit("tool preflight excludes product and lock modes")
          if not re.fullmatch(r"[0-9a-f]{40}", os.environ["SOURCE_REVISION"]):
              raise SystemExit("source_revision must be an exact reviewed 40-hex SHA")
          PYTHON
      - name: Checkout tool preflight source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.source_revision }}
          persist-credentials: false
      - name: Inspect preinstalled tools without privilege
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: python3 -I .github/probes/nat-topology/quic/product/preflight.py --source "$SOURCE_REVISION"
      - name: Preserve tool-only preflight report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: controlled-network-tools
          path: target/controlled-network-tools/report.json
          if-no-files-found: error

  controlled-network-matrix:
    if: ${{ inputs.controlled_network_matrix && !inputs.controlled_network_preflight && !inputs.direct_feedback }}
    name: Controlled NAT matrix (privileged namespaces; disposable runner only)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: "1.99.1"
    steps:
      - name: Validate exclusive controlled-network request and source
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
          DIRECT_FEEDBACK: ${{ inputs.direct_feedback }}
          PREFLIGHT: ${{ inputs.controlled_network_preflight }}
        run: |
          python3 -I - <<'PYTHON'
          import os
          import re
          if os.environ["DIRECT_FEEDBACK"] != "false" or os.environ["PREFLIGHT"] != "false":
              raise SystemExit("the privileged matrix excludes lock, process and tool-preflight modes")
          if not re.fullmatch(r"[0-9a-f]{40}", os.environ["SOURCE_REVISION"]):
              raise SystemExit("source_revision must be an exact reviewed 40-hex SHA")
          PYTHON
      - name: Checkout the exact reviewed source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_revision }}
          persist-credentials: false
      - name: Verify checked-out source revision
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install Rust 1.99.1
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Prepare current reviewed product sources without lock generation
        uses: ./.github/actions/prepare-sources
        with:
          selection: '{"relay": false, "dns": false, "resolver": false, "kad": false}'
          resolve_only: "false"
      - name: Compile normal products and record provenance without privilege
        run: python -I .github/ci/run.py product-manifest
      - name: Inspect preinstalled network tools without privilege
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: python -I .github/probes/nat-topology/quic/product/preflight.py --source "$SOURCE_REVISION"
      - name: Run the bounded privileged phase (the only step using sudo)
        timeout-minutes: 22
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
          MATRIX_GROUP: ${{ inputs.controlled_network_group }}
        run: |
          set -euo pipefail
          sudo -n true
          sudo -n -E env PATH="$PATH" "$(command -v python)" -I .github/probes/nat-topology/quic/product/runtime/phase.py \
            --source "$SOURCE_REVISION" --manifest "$PWD/target/ci-product/manifest.json" --group "$MATRIX_GROUP"
      - name: Preserve controlled-network evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: controlled-network-matrix
          path: |
            .github/probes/nat-topology/out/
            target/ci-product/manifest.json
            target/ci-product/products.build.stderr
            target/controlled-network-tools/report.json
          if-no-files-found: error

  resource-budget:
    if: ${{ inputs.resource_measurement && !inputs.direct_feedback && !inputs.controlled_network_preflight && !inputs.controlled_network_matrix }}
    name: P14 resource budgets (loopback only; release products)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      RUSTUP_TOOLCHAIN: "1.99.1"
    steps:
      - name: Validate exclusive resource request and source
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: |
          python3 -I - <<'PYTHON'
          import os
          import re
          if not re.fullmatch(r"[0-9a-f]{40}", os.environ["SOURCE_REVISION"]):
              raise SystemExit("source_revision must be an exact reviewed 40-hex SHA")
          PYTHON
      - name: Checkout the exact reviewed source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_revision }}
          persist-credentials: false
      - name: Verify checked-out source revision
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install Rust 1.99.1
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Prepare current reviewed product sources without lock generation
        uses: ./.github/actions/prepare-sources
        with:
          selection: '{"relay": false, "dns": false, "resolver": false, "kad": false}'
          resolve_only: "false"
      - name: Build release products and the harness binary (no execution)
        run: python -I .github/ci/run.py resource-build
      - name: Run the loopback measurement (at most 15 minutes, unprivileged, no public network)
        timeout-minutes: 16
        run: python -I .github/ci/run.py resource-run
      - name: Preserve resource measurement evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resource-budget
          path: target/ci-resources/
          if-no-files-found: error
