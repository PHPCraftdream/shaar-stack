name: SDK lockfile preparation

on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Reviewed candidate commit in this repository
        required: true
        type: string
      direct_feedback:
        description: Run the reviewed process lifecycle cases instead of resolving a lockfile
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  resolve:
    if: ${{ !inputs.direct_feedback }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUSTUP_TOOLCHAIN: "1.99.1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_revision }}
          persist-credentials: false
      - name: Install the pinned resolver toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Record the source revision
        run: git rev-parse HEAD
      - name: Resolve the canonical workspace lockfile
        id: resolve
        run: cargo generate-lockfile
      - name: Retain the successfully resolved text lockfile
        if: ${{ success() && steps.resolve.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-cargo-lock
          path: Cargo.lock
          if-no-files-found: error

  direct-feedback:
    if: ${{ inputs.direct_feedback }}
    name: Process feedback (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: "1.99.1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_revision }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install Rust 1.99.1
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      - name: Structural limits
        run: python -I -X utf8 .github/scripts/check_structure.py
      - name: Structural guard tests
        run: python -I -X utf8 -m unittest discover -s .github/scripts/tests
      - name: Prepare current reviewed product sources without lock generation
        uses: ./.github/actions/prepare-sources
        with:
          selection: '{"relay": false, "dns": false, "resolver": false, "kad": false}'
          resolve_only: "false"
      - name: cargo fmt
        shell: bash
        run: |
          cargo fmt -p shaar -p shaar-ygg -p shaar-p2p -p shaar-server -p shaar-client -p shaar-platform -- --check
          cargo fmt --manifest-path crates/shaar-ygg-core/Cargo.toml -- --check
      - name: Scoped all-target clippy
        run: cargo clippy -p shaar -p shaar-server -p shaar-client --all-targets --locked -- -D warnings
      - name: Verify reviewed process lifecycle cases and binary provenance
        run: python -I .github/ci/run.py process-feedback
      - name: Preserve direct-process execution and preparation receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: direct-process-${{ matrix.os }}
          path: |
            target/ci-process/
            target/native-graph-preparation-logs/
            target/p2p/graph-receipt.json
          if-no-files-found: error
