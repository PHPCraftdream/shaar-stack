# Historical ABI check, no longer part of automatic CI.
# Source removal is pending explicit tool permission.
name: Go ABI (retired)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-abi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  GOTOOLCHAIN: local
  GO111MODULE: "off"
  CGO_ENABLED: "1"
  RUSTUP_TOOLCHAIN: "1.99.1"
  CC: gcc

jobs:
  abi:
    name: c-archive+rustc (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27.3"
          cache: false
      - name: Install Rust and the actual link target
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt
          rustup target add --toolchain 1.99.1 "${{ matrix.target }}"
      - name: Select the preinstalled Windows GNU compiler
        if: runner.os == 'Windows'
        run: |
          test -x /c/mingw64/bin/gcc.exe
          echo "C:/mingw64/bin" >> "$GITHUB_PATH"
      - name: Record toolchain versions
        run: |
          go version
          rustc --version --verbose
          gcc --version
          gcc -dumpmachine
      - name: Check source formatting
        run: |
          git ls-files --eol -- .github/abi/goprobe/main.go
          unformatted=$(gofmt -l .github/abi/goprobe/main.go)
          if [[ -n "$unformatted" ]]; then
            gofmt -d .github/abi/goprobe/main.go
            exit 1
          fi
          rustfmt --edition 2024 --check .github/abi/rustprobe/probe.rs
      - name: Build the Go archive
        run: |
          mkdir -p target/abi
          go build -buildmode=c-archive -o target/abi/libgoprobe.a ./.github/abi/goprobe
      - name: Link the standalone Rust probe
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            system_libs=(-l winmm -l ws2_32 -l ntdll -l bcrypt)
            output=target/abi/probe.exe
          else
            system_libs=(-l pthread -l dl -l m -l resolv)
            output=target/abi/probe
          fi
          rustc --edition 2024 --target "${{ matrix.target }}" -C linker=gcc \
            -L native=target/abi -l static=goprobe "${system_libs[@]}" \
            .github/abi/rustprobe/probe.rs -o "$output"
      - name: Execute foreign-call vectors
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            ./target/abi/probe.exe
          else
            ./target/abi/probe
          fi
