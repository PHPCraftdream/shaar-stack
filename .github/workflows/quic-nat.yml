name: QUIC two-NAT proof

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - ".github/probes/nat-topology/**"
      - ".github/probes/iroh-paths/**"
      - ".github/workflows/quic-nat.yml"
  pull_request:
    paths:
      - ".github/probes/nat-topology/**"
      - ".github/probes/iroh-paths/**"
      - ".github/workflows/quic-nat.yml"

permissions:
  contents: read

concurrency:
  group: quic-nat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Install bounded CI capture dependencies
        run: |
          set -euo pipefail
          timeout 180 sudo apt-get update -qq
          timeout 180 sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends conntrack tcpdump tshark ethtool iptables
          tcpdump --version
          tshark --version
          ethtool --version
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt
          rustup override set 1.99.1
      - name: Prepare reviewed same-version source patches
        run: |
          set -euo pipefail
          mkdir -p target/quic-nat/noq-archive target/quic-nat/iroh-archive
          curl --fail --location --max-time 120 https://static.crates.io/crates/noq-proto/noq-proto-1.3.0.crate --output target/quic-nat/noq-archive/noq.crate
          curl --fail --location --max-time 120 https://static.crates.io/crates/iroh/iroh-1.3.0.crate --output target/quic-nat/iroh-archive/iroh.crate
          python3 -I .github/probes/iroh-paths/gate/prepare.py \
            --archive target/quic-nat/noq-archive/noq.crate --lock .github/probes/iroh-paths/Cargo.lock --destination target/quic-nat/noq-source
          python3 -I .github/probes/iroh-paths/gate/bridge/prepare.py \
            --archive target/quic-nat/iroh-archive/iroh.crate --probe .github/probes/iroh-paths \
            --noq-source target/quic-nat/noq-source/noq-proto-1.3.0 --destination target/quic-nat/bridge
      - name: Execute pure oracle and helper checks before privilege
        run: |
          set -euo pipefail
          python3 -I .github/probes/nat-topology/quic/checks.py -v
          python3 -I .github/probes/nat-topology/checks/selftest.py -v
          manifest=target/quic-nat/bridge/probe/Cargo.toml
          cargo fmt --manifest-path "$manifest" --all
          cargo test --manifest-path "$manifest" --locked --bin nat-peer
          cargo build --manifest-path "$manifest" --locked --bin nat-peer
      - name: Prove actual NAT traversal and negative controls
        working-directory: .github/probes/nat-topology
        run: |
          set -euo pipefail
          binary="$(realpath ../../../target/quic-nat/bridge/probe/target/debug/nat-peer)"
          for kind in positive blocked wrong-tuple; do
            casedir="out/quic-${kind}-$(date +%s%N)"
            nonce="$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
            sudo -E env PATH="$PATH" FIXTURE_QUIC_BINARY="$binary" FIXTURE_QUIC_CASE="$kind" bash run.sh "$casedir" "$nonce"
            sudo python3 -I checks/selftest.py validate-cleanup "$casedir/cleanup-evidence.json" --case normal --nonce "$nonce"
            sudo python3 -I checks/selftest.py validate-evidence "$casedir/evidence.json" --expect-status pass --nonce "$nonce"
          done
      - name: Verify setup and live-peer failure cleanup
        working-directory: .github/probes/nat-topology
        run: |
          set -euo pipefail
          binary="$(realpath ../../../target/quic-nat/bridge/probe/target/debug/nat-peer)"
          for phase in setup fixture; do
            casedir="out/quic-${phase}-fault-$(date +%s%N)"
            nonce="$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
            if sudo -E env PATH="$PATH" FIXTURE_QUIC_BINARY="$binary" bash run.sh "--fault-inject-${phase}" "$casedir" "$nonce"; then
              printf 'fault case unexpectedly succeeded\n' >&2; exit 1
            fi
            sudo python3 -I checks/selftest.py validate-cleanup "$casedir/cleanup-evidence.json" --case "${phase}-fault" --nonce "$nonce"
            if [ "$phase" = fixture ]; then
              sudo python3 -I checks/selftest.py validate-evidence "$casedir/evidence.json" --expect-status fail --expect-exception-substr "injected fixture failure" --nonce "$nonce"
            fi
          done
      - name: Verify SIGTERM with owned process identity and reaping
        working-directory: .github/probes/nat-topology
        run: |
          set -euo pipefail
          binary="$(realpath ../../../target/quic-nat/bridge/probe/target/debug/nat-peer)"
          casedir="$(pwd)/out/quic-interrupt-$(date +%s%N)"
          nonce="$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          sudo -E env PATH="$PATH" FIXTURE_QUIC_BINARY="$binary" python3 -I checks/selftest.py supervise-interrupt "$(pwd)/run.sh" "$casedir" "$nonce" 60
      - name: Upload all scoped proof artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: quic-nat-proof
          path: |
            .github/probes/nat-topology/out/
            target/quic-nat/bridge/probe/Cargo.lock
          if-no-files-found: warn
