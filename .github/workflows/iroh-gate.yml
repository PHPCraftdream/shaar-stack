name: iroh payload gate bridge

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - ".github/probes/iroh-paths/**"
      - ".github/workflows/iroh-gate.yml"
  pull_request:
    paths:
      - ".github/probes/iroh-paths/**"
      - ".github/workflows/iroh-gate.yml"

permissions:
  contents: read

concurrency:
  group: iroh-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridge:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt
          rustup override set 1.99.1
      - name: Prepare verified sources without executing them
        run: |
          set -euo pipefail
          mkdir -p target/iroh-gate/noq-archive target/iroh-gate/iroh-archive
          curl --fail --location --max-time 120 \
            https://static.crates.io/crates/noq-proto/noq-proto-1.3.0.crate \
            --output target/iroh-gate/noq-archive/noq-proto.crate
          curl --fail --location --max-time 120 \
            https://static.crates.io/crates/iroh/iroh-1.3.0.crate \
            --output target/iroh-gate/iroh-archive/iroh.crate
          python3 -I .github/probes/iroh-paths/gate/prepare.py \
            --archive target/iroh-gate/noq-archive/noq-proto.crate \
            --lock .github/probes/iroh-paths/Cargo.lock \
            --destination target/iroh-gate/noq-source
          python3 -I .github/probes/iroh-paths/gate/bridge/prepare.py \
            --archive target/iroh-gate/iroh-archive/iroh.crate \
            --probe .github/probes/iroh-paths \
            --noq-source target/iroh-gate/noq-source/noq-proto-1.3.0 \
            --destination target/iroh-gate/bridge
          python3 -I .github/probes/iroh-paths/gate/bridge/checks.py \
            --archive target/iroh-gate/iroh-archive/iroh.crate \
            --probe .github/probes/iroh-paths \
            --noq-source target/iroh-gate/noq-source/noq-proto-1.3.0
      - name: Check authored formatting and execute real iroh calibration
        run: |
          set -euo pipefail
          manifest=target/iroh-gate/bridge/probe/Cargo.toml
          rustfmt --edition 2024 --check .github/probes/iroh-paths/gate/bridge/calibration.rs
          cargo fmt --manifest-path "$manifest" --all
          cargo test --manifest-path "$manifest" --locked --lib
          cargo test --manifest-path "$manifest" --locked --test calibration -- --nocapture
      - name: Upload bridge evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: iroh-gate-${{ matrix.os }}
          path: |
            target/iroh-gate/bridge/probe/Cargo.lock
            target/iroh-gate/bridge/probe/tests/calibration.rs
            target/iroh-gate/bridge/probe/target/iroh-paths/
          if-no-files-found: warn
