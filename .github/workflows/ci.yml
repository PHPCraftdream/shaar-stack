# Sha'ar Stack CI: formatting, lint, tests, structural limits.
# Note: the structural guard and its tests in CI run on tracked paths.
# `git ls-files` does not see new untracked files of the current task;
# after the integration commit all new files are checked normally.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      p08_graph:
        description: Resolve and compile the reviewed P08 candidate graph without changing the product lock
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: fmt+clippy+test+structure (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: "1.99.1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # Pin the Python version for stability of the guard and its tests.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install Rust 1.99.1
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      - name: Prepare reviewed production backend sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/backend-archives/noq target/backend-archives/iroh target/backend-archives/runtime
          curl --fail --location --max-time 120 \
            https://static.crates.io/crates/noq-proto/noq-proto-1.3.0.crate \
            --output target/backend-archives/noq/noq-proto.crate
          curl --fail --location --max-time 120 \
            https://static.crates.io/crates/iroh/iroh-1.3.0.crate \
            --output target/backend-archives/iroh/iroh.crate
          curl --fail --location --max-time 120 \
            https://static.crates.io/crates/noq/noq-1.3.0.crate \
            --output target/backend-archives/runtime/noq.crate
          python -I .github/scripts/backend/prepare.py \
            --noq-archive target/backend-archives/noq/noq-proto.crate \
            --iroh-archive target/backend-archives/iroh/iroh.crate \
            --runtime-archive target/backend-archives/runtime/noq.crate \
            --lock .github/probes/iroh-paths/Cargo.lock --destination target/backend
      - name: Prepare reviewed signaling dependencies and expiry controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/p2p/relay-archive target/p2p/swarm-archive
          curl --fail --location --max-time 120 --max-filesize 2097152 https://static.crates.io/crates/libp2p-relay/libp2p-relay-0.22.0.crate --output target/p2p/relay-archive/relay.crate
          curl --fail --location --max-time 120 --max-filesize 2097152 https://static.crates.io/crates/libp2p-swarm/libp2p-swarm-0.48.0.crate --output target/p2p/swarm-archive/swarm.crate
          python -I .github/scripts/p2p/prepare.py --archive target/p2p/relay-archive/relay.crate --destination target/p2p/relay --swarm-archive target/p2p/swarm-archive/swarm.crate --swarm-destination target/p2p/swarm
          python -I .github/scripts/p2p/checks.py
          if [[ "$RUNNER_OS" == Windows ]]; then binary="$RUNNER_TEMP/p2p-lease.exe"; else binary="$RUNNER_TEMP/p2p-lease"; fi
          rustc --edition 2024 --test -D warnings .github/scripts/p2p/lease.rs -o "$binary"
          "$binary"
      - name: Verify ingress ownership and budget boundaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/ingress-budget-tests
          rustc --edition 2024 --test -D warnings .github/scripts/backend/ingress_budget.rs --out-dir target/ingress-budget-tests
          binary=target/ingress-budget-tests/ingress_budget
          if [ "$RUNNER_OS" = Windows ]; then binary="$binary.exe"; fi
          "$binary"
      # --locked rejects mismatches with the lock graph without regenerating it.
      # Full test runs are executed only in CI.
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Verify actor abort joins native resource destruction
        run: cargo test -p shaar --locked --test backend_gate actor_shutdown::tests
      - name: Diagnose native-after-signaling path lifecycle (Windows only)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          test_name=network::signaling::endpoint::tests::native_app_and_both_joined_backends_close_with_sessions_and_factories_retained
          for trial in {1..12}; do
            printf 'Native path lifecycle trial %s/12\n' "$trial"
            log="$RUNNER_TEMP/shaar-native-path-$trial.log"
            if cargo test -p shaar --lib --locked "$test_name" -- --exact --color never >"$log" 2>&1; then
              status=0
            else
              status=$?
            fi
            if ! python -I -X utf8 .github/scripts/scan_identity_output.py "$log"; then exit 1; fi
            cat "$log"
            if [[ "$status" -ne 0 ]]; then exit "$status"; fi
            grep -Fx "test $test_name ... ok" "$log"
          done
      - name: cargo test
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/shaar-test.log"
          if cargo test --workspace --locked >"$log" 2>&1; then
            status=0
          else
            status=$?
          fi
          if ! python -I -X utf8 .github/scripts/scan_identity_output.py "$log"; then exit 1; fi
          cat "$log"
          exit "$status"
      # SEC-KEY-02: explicit run of the ignored sudo probe. Fail-closed: the
      # step passes only if the standard non-quiet harness prints the exact
      # success line for the fully qualified test name, so a run selecting
      # zero tests, or missing sudo/setup, can never false-pass.
      - name: SEC-KEY-02 unprivileged reader probe (Ubuntu only)
        shell: bash
        if: matrix.os == 'ubuntu-latest'
        env:
          TEST_NAME: identity::store::tests::unprivileged_reader::identity_unprivileged_uid_cannot_read_seed_file
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/shaar-unprivileged-reader.log"
          if cargo test -p shaar --lib --locked -- --ignored --exact "$TEST_NAME" --color never >"$log" 2>&1; then
            status=0
          else
            status=$?
          fi
          if ! python -I -X utf8 .github/scripts/scan_identity_output.py "$log"; then exit 1; fi
          cat "$log"
          if [[ "$status" -ne 0 ]]; then exit "$status"; fi
          grep -Fx "test $TEST_NAME ... ok" "$log"
      - name: Record toolchain versions
        run: |
          rustc --version --verbose
          cargo --version
      - name: Structural limits
        run: python -I -X utf8 .github/scripts/check_structure.py
      - name: Structural guard tests
        run: python -I -X utf8 -m unittest discover -s .github/scripts/tests
      - name: Resolve reviewed P08 candidate graph and verify relay expiry boundary
        if: github.event_name == 'workflow_dispatch' && inputs.p08_graph
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/p08/relay-archive target/p08/swarm-archive
          curl --fail --location --max-time 120 --max-filesize 2097152 https://static.crates.io/crates/libp2p-relay/libp2p-relay-0.22.0.crate --output target/p08/relay-archive/relay.crate
          curl --fail --location --max-time 120 --max-filesize 2097152 https://static.crates.io/crates/libp2p-swarm/libp2p-swarm-0.48.0.crate --output target/p08/swarm-archive/swarm.crate
          python -I .github/scripts/p2p/prepare.py --archive target/p08/relay-archive/relay.crate --destination target/p08/relay --swarm-archive target/p08/swarm-archive/swarm.crate --swarm-destination target/p08/swarm
          python -I .github/scripts/p2p/checks.py
          if [[ "$RUNNER_OS" == Windows ]]; then binary="$RUNNER_TEMP/p08-lease.exe"; else binary="$RUNNER_TEMP/p08-lease"; fi
          rustc --edition 2024 --test -D warnings .github/scripts/p2p/lease.rs -o "$binary"
          "$binary"
          relay=target/p08/relay/libp2p-relay-0.22.0
          swarm=target/p08/swarm/libp2p-swarm-0.48.0
          python -I .github/scripts/p2p/graph.py create --repository . --destination target/p08/workspace --relay-source "$relay" --swarm-source "$swarm"
          cargo metadata --manifest-path target/p08/workspace/Cargo.toml --format-version 1 > target/p08/metadata.json
          python -I .github/scripts/p2p/graph.py verify --workspace target/p08/workspace --metadata target/p08/metadata.json --relay-source "$relay" --swarm-source "$swarm"
          cargo test --manifest-path target/p08/workspace/Cargo.toml -p shaar-p2p --locked --lib
          python -I .github/scripts/p2p/graph.py verify --workspace target/p08/workspace --metadata target/p08/metadata.json --relay-source "$relay" --swarm-source "$swarm"
      - name: Preserve reviewed P08 candidate lock and provenance
        if: always() && github.event_name == 'workflow_dispatch' && inputs.p08_graph
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: p08-graph-${{ matrix.os }}
          path: |
            target/p08/workspace/Cargo.lock
            target/p08/workspace/crates/shaar-p2p/Cargo.toml
            target/p08/workspace/graph-receipt.json
            target/p08/relay/provenance.json
            target/p08/swarm/provenance.json
          if-no-files-found: warn
