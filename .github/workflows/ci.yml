          python -I - <<'PY'
          import hashlib
          from pathlib import Path
          import shutil
          source = Path("target/backend/noq-proto/noq-proto-1.3.0")
          destination = Path("target/native-retention/noq-proto-1.3.0")
          shutil.copytree(source, destination, ignore=shutil.ignore_patterns("target", "__pycache__"))
          module = destination / "src/tests/mod.rs"
          text = module.read_text(encoding="utf-8")
          if "mod native_retention;" in text:
              raise ValueError("unexpected existing native retention tests")
          module.write_text(text + "\nmod native_retention;\n", encoding="utf-8")
          shutil.copyfile(
              ".github/probes/iroh-paths/gate/bridge/support/native_retention.rs",
              destination / "src/tests/native_retention.rs",
          )
          original_lock = (source / "Cargo.lock").read_bytes()
          if (destination / "Cargo.lock").read_bytes() != original_lock:
              raise ValueError("protocol archive test lock changed")
          print("Protocol archive test lock SHA256:", hashlib.sha256(original_lock).hexdigest())
          PY
          log="$RUNNER_TEMP/shaar-native-retention.log"
          bash .github/scripts/p2p/discovery/owned_dns/cargo.sh tests::native_retention:: native-retention "$log" noq_proto target/native-retention/noq-proto-1.3.0/src/lib.rs target/native-retention/noq-proto-1.3.0/target normal --locked --manifest-path target/native-retention/noq-proto-1.3.0/Cargo.toml --lib
