# CI Sha'ar Stack: форматирование, линк, тесты, структурные ограничения.
# Примечание: структурный guard и его тесты в CI выполняются на tracked-путях.
# `git ls-files` не видит новые untracked-файлы текущей задачи; после
# integration commit все новые файлы проверяются штатно.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: fmt+clippy+test+structure (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: "1.99.1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # Фиксация версии Python для стабильности guard'а и его тестов.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install Rust 1.99.1
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      # --locked отклоняет несоответствие графу без пересоздания lock.
      # Полные тестовые прогоны выполняются только в CI.
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo test
        run: cargo test --workspace --locked
      - name: Запись версий toolchain
        run: |
          rustc --version --verbose
          cargo --version
      - name: Структурные ограничения
        run: python -I -X utf8 .github/scripts/check_structure.py
      - name: Тесты структурного guard
        run: python -I -X utf8 -m unittest discover -s .github/scripts/tests
