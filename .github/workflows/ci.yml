# Sha'ar Stack CI: formatting, lint, tests, structural limits.
# Note: the structural guard and its tests in CI run on tracked paths.
# `git ls-files` does not see new untracked files of the current task;
# after the integration commit all new files are checked normally.
name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: Targeted checks or explicit end-of-sprint full campaign
        type: choice
        options: [targeted, full]
        default: targeted
      base:
        description: Optional manual comparison SHA (empty uses the normal branch comparison)
        type: string
        default: ''
      p08_graph:
        description: Resolve and compile the reviewed P08 candidate graph without changing the product lock
        type: boolean
        required: false
        default: false
      native_graph_resolve:
        description: Resolve a native graph candidate; candidate artifact is not acceptance
        type: boolean
        required: false
        default: false
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      selection: ${{ steps.plan.outputs.selection }}
      targets: ${{ steps.plan.outputs.targets }}
      receipt: ${{ steps.receipt.outputs.json }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Fetch upstream comparison base for feature revisions
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref != 'refs/heads/develop'
        shell: bash
        run: |
          if ! git fetch --no-tags https://github.com/PHPCraftdream/shaar-stack.git refs/heads/develop:refs/remotes/ci-upstream/develop; then
            printf 'Upstream comparison unavailable; targeted selection requires a usable local base\n'
          fi
      - run: python -I -m unittest discover -s .github/ci
      - id: plan
        run: python -I .github/ci/plan.py
      - id: receipt
        run: python -I -c "import json,os,pathlib; data=json.loads(pathlib.Path('ci-plan.json').read_text(encoding='utf-8')); open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8').write('json='+json.dumps(data,separators=(',',':'))+'\\n')"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ci-selection
          path: ci-plan.json
          if-no-files-found: error
  native_graph_resolve:
    if: github.event_name == 'workflow_dispatch' && inputs.native_graph_resolve
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: "1.99.1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install Rust 1.99.1
        run: rustup toolchain install 1.99.1 --profile minimal
      - uses: ./.github/actions/prepare-sources
        with:
          selection: '{"native_graph":true,"relay":false,"dns":false,"resolver":false,"kad":false}'
          resolve_only: "true"
      - name: Resolve native graph candidate
        run: python -I .github/probes/native-graph/ci.py resolve
      - name: Preserve native graph candidate evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-graph-candidate
          path: |
            Cargo.lock
            target/native-graph/Cargo.before.lock
            target/native-graph/Cargo.candidate.lock
            target/native-graph/ci-receipt.json
            target/native-graph/logs/
            target/native-graph/*.provenance.json
          if-no-files-found: error
      - name: Preserve native graph preparation diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-graph-preparation-diagnostics
          path: target/native-graph-preparation-logs/
          if-no-files-found: error
  checks:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.native_graph_resolve) }}
    needs: plan
    name: fmt+clippy+test+structure (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: "1.99.1"
      CI_TARGETS: ${{ needs.plan.outputs.targets }}
      CI_PLAN_JSON: ${{ needs.plan.outputs.receipt }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      # Pin the Python version for stability of the guard and its tests.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install Rust 1.99.1
        if: fromJSON(needs.plan.outputs.selection).prepare || fromJSON(needs.plan.outputs.selection).ci_policy
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      - name: Verify supplied timestamp encoder against archive graph
        if: fromJSON(needs.plan.outputs.selection).publication
        shell: bash
        run: bash .github/scripts/p2p/discovery/mainline/ci/publication/execution/verify.sh
      - name: Preserve supplied timestamp encoder evidence
        if: always() && fromJSON(needs.plan.outputs.selection).publication
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: publication-${{ matrix.os }}
          path: target/publication-evidence/
          if-no-files-found: error
      - name: Verify mainline lifecycle archive against planned revision
        if: fromJSON(needs.plan.outputs.selection).mainline
        shell: bash
        run: |
          set -euo pipefail
          python -I -m unittest discover -s .github/scripts/p2p/discovery/mainline/ci -p 'test_*.py'
          python -I -c 'import json,os; p=json.loads(os.environ["CI_PLAN_JSON"]); assert p["selection"]["mainline"] is True; assert p["head"] and p["scope"] in {"full","targeted"}; assert p["scope"] == "full" or p["base"]'
          mkdir -p target/mainline-archive
          curl --fail --location --max-time 120 --max-filesize 16777216 https://static.crates.io/crates/n0-mainline/n0-mainline-0.7.0.crate --output target/mainline-archive/n0-mainline-0.7.0.crate
          curl --fail --location --max-time 120 --max-filesize 2097152 https://static.crates.io/crates/serde_bencode/serde_bencode-0.2.4.crate --output target/mainline-archive/serde_bencode-0.2.4.crate
          python -I .github/scripts/p2p/discovery/mainline/ci/run.py --archive target/mainline-archive/n0-mainline-0.7.0.crate --bencode-archive target/mainline-archive/serde_bencode-0.2.4.crate --destination target/mainline-lifecycle --plan-json "$CI_PLAN_JSON"
      - name: Preserve mainline lifecycle evidence
        if: always() && fromJSON(needs.plan.outputs.selection).mainline
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mainline-lifecycle-${{ matrix.os }}
          path: target/mainline-lifecycle/evidence/
          if-no-files-found: error
      - name: Verify selected-test runner with real libtest filters
        if: fromJSON(needs.plan.outputs.selection).ci_policy
        run: python -I .github/ci/run.py self-test
      - uses: ./.github/actions/prepare-sources
        id: prepare_sources
        if: fromJSON(needs.plan.outputs.selection).prepare && (fromJSON(needs.plan.outputs.selection).product || fromJSON(needs.plan.outputs.selection).dns || fromJSON(needs.plan.outputs.selection).discovery || fromJSON(needs.plan.outputs.selection).carrier || fromJSON(needs.plan.outputs.selection).carrier_frames || fromJSON(needs.plan.outputs.selection).relay || fromJSON(needs.plan.outputs.selection).resolver || fromJSON(needs.plan.outputs.selection).kad || fromJSON(needs.plan.outputs.selection).backend || fromJSON(needs.plan.outputs.selection).sdk || fromJSON(needs.plan.outputs.selection).apps || fromJSON(needs.plan.outputs.selection).license || fromJSON(needs.plan.outputs.selection).native_graph || fromJSON(needs.plan.outputs.selection).ygg)
        with:
          selection: ${{ needs.plan.outputs.selection }}
      - name: Preserve source preparation diagnostics
        if: always() && steps.prepare_sources.outcome != 'skipped' && steps.prepare_sources.outcome != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: source-preparation-${{ matrix.os }}
          path: target/native-graph-preparation-logs/
          if-no-files-found: error
      - name: Verify real-carrier observer source contracts
        if: fromJSON(needs.plan.outputs.selection).carrier_frames
        shell: bash
        run: |
          set -euo pipefail
          python -I -m unittest discover -s .github/probes/iroh-paths/carrier -p checks.py
          python -I .github/probes/iroh-paths/carrier/run.py
      - name: Verify real-carrier strict and allow-all bootstrap frames
        if: fromJSON(needs.plan.outputs.selection).carrier_frames
        shell: bash
        run: python -I .github/probes/iroh-paths/carrier/run.py --wire
      - name: Preserve real-carrier bootstrap frame receipts
        if: always() && fromJSON(needs.plan.outputs.selection).carrier_frames
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: carrier-frame-wire-${{ matrix.os }}
          path: |
            target/carrier-frame-wire-*/receipt.json
            target/carrier-frame-wire-*/*/target/ci-selected/*
            target/carrier-frame-wire-*/*/target/frame-traces/*
          if-no-files-found: warn
      - name: Preserve carrier observer source receipts
        if: always() && fromJSON(needs.plan.outputs.selection).carrier_frames
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: carrier-frame-source-${{ matrix.os }}
          path: |
            target/carrier-frame-source-*/receipt.json
            target/carrier-frame-source-*/workspace/target/ci-selected/*
          if-no-files-found: warn
      - name: Verify relay operation units, wire cases and isolated counterfactuals
        if: fromJSON(needs.plan.outputs.selection).relay
        shell: bash
        run: |
          set -euo pipefail
          python -I .github/scripts/p2p/relay/fixtures/wire/run.py --repository . --source target/p2p/relay/libp2p-relay-0.22.0 --destination target/relay-operation-wire
      - name: Verify Carrier protocol barrier and isolated guard counterfactual
        if: fromJSON(needs.plan.outputs.selection).carrier
        shell: bash
        run: |
          set -euo pipefail
          python -I .github/scripts/p2p/carrier-wire-proof/checks.py
          python -I .github/scripts/p2p/carrier-wire-proof/run.py --repository . --destination target/carrier-wire-proof
      - name: Preserve Carrier protocol proof receipts
        if: always() && fromJSON(needs.plan.outputs.selection).carrier
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: carrier-protocol-proof-${{ matrix.os }}
          path: |
            target/carrier-wire-proof/*.json
            target/carrier-wire-proof/*/*.json
            target/carrier-wire-proof/*/*.jsonl
            target/carrier-wire-proof/*/*.log
            target/carrier-wire-proof/*/workspace/Cargo.lock
          if-no-files-found: warn
      - name: Verify resolver locking with archive features and genuine counterfactuals
        if: fromJSON(needs.plan.outputs.selection).resolver
        shell: bash
        run: |
          set -euo pipefail
          for profile in plain tls; do
            extra=()
            if [[ "$profile" == tls ]]; then extra=(--features tls-ring); fi
            log="$RUNNER_TEMP/shaar-resolver-$profile.log"
            bash .github/scripts/p2p/discovery/owned_dns/cargo.sh locking_ "resolver-$profile" "$log" hickory_resolver target/resolver-locking-archive/src/lib.rs target/resolver-locking-archive/target normal --locked --manifest-path target/resolver-locking-archive/Cargo.toml --lib "${extra[@]}"
          done
          for mechanism in connections cleanup; do
            if [[ "$mechanism" == connections ]]; then
              test_name=name_server::locking_connections::transport_wait_releases_connections_and_wakes
              marker=CONNECTIONS_HELD_WHILE_WAITING
            else
              test_name=name_server_pool::locking_cleanup::last_shared_future_is_destroyed_after_unlock_and_can_reenter
              marker=FOREIGN_FUTURE_DROPPED_UNDER_LOCK
            fi
            log="$RUNNER_TEMP/shaar-resolver-counterfactual-$mechanism.log"
            if cargo test --locked --manifest-path "target/resolver-locking-counterfactual-$mechanism/Cargo.toml" --lib "$test_name" -- --exact >"$log" 2>&1; then status=0; else status=$?; fi
            python -I -X utf8 .github/scripts/scan_identity_output.py "$log"
            cat "$log"
            if [[ "$status" -eq 0 ]]; then printf 'Unfixed resolver unexpectedly passed\n'; exit 1; fi
            grep -Fx "test $test_name ... FAILED" "$log"
            grep -F "$marker" "$log"
            grep -E '^test result: FAILED\. 0 passed; 1 failed;' "$log"
          done
      - name: Verify zero-capacity cache contracts and isolated counterfactuals
        if: fromJSON(needs.plan.outputs.selection).resolver
        shell: bash
        run: |
          set -euo pipefail
          for profile in plain dnssec; do
            extra=()
            if [[ "$profile" == dnssec ]]; then extra=(--features dnssec-ring,metrics,recursor,serde); fi
            log="$RUNNER_TEMP/shaar-resolver-cache-$profile.log"
            bash .github/scripts/p2p/discovery/owned_dns/cargo.sh no_cache_ "resolver-cache-$profile" "$log" hickory_resolver target/resolver-locking-archive/src/lib.rs target/resolver-locking-archive/target normal --locked --manifest-path target/resolver-locking-archive/Cargo.toml --lib "${extra[@]}"
          done
          for mechanism in cache_constructor cache_positive cache_error cache_alias cache_storage; do
            case "$mechanism" in
              cache_constructor)
                test_name=cache::no_cache_storage::zero_capacity_never_constructs_moka_and_clones_share_configuration
                marker=ZERO_CAPACITY_CONSTRUCTED_MOKA ;;
              cache_positive)
                test_name=caching_client::no_cache_client::positive_finalization_moves_all_nonempty_section_buffers
                marker=DISABLED_CACHE_COPIED_POSITIVE_MESSAGE ;;
              cache_error)
                test_name=caching_client::no_cache_client::error_finalization_skips_cache_clone_and_preserves_original_error
                marker=DISABLED_CACHE_CLONED_ERROR ;;
              cache_alias)
                test_name=caching_client::no_cache_client::alias_finalization_skips_cache_message_and_preserves_child_lookup
                marker=DISABLED_CACHE_BUILT_ALIAS_MESSAGE ;;
              cache_storage)
                test_name=cache::no_cache_storage::disabled_storage_skips_upsert_work_and_clear_is_harmless
                marker=DISABLED_CACHE_PERFORMED_STORAGE_WORK ;;
            esac
            log="$RUNNER_TEMP/shaar-resolver-counterfactual-$mechanism.log"
            fixture="target/resolver-locking-counterfactual-$mechanism"
            build="$fixture/target"
            if [[ -e "$build" ]]; then printf 'Counterfactual target must be fresh: %s\n' "$build"; exit 1; fi
            if cargo test --locked --verbose --target-dir "$build" --manifest-path "$fixture/Cargo.toml" --lib "$test_name" -- --exact >"$log" 2>&1; then status=0; else status=$?; fi
            python -I -X utf8 .github/scripts/scan_identity_output.py "$log"
            cat "$log"
            grep -E "Compiling hickory-resolver v0\\.26\\.3 .*resolver-locking-counterfactual-$mechanism" "$log"
            grep -E "Running .*resolver-locking-counterfactual-$mechanism.*hickory_resolver-" "$log"
            if [[ "$status" -eq 0 ]]; then printf 'Cache counterfactual unexpectedly passed\n'; exit 1; fi
            grep -Fx "test $test_name ... FAILED" "$log"
            grep -F "$marker" "$log"
            grep -E '^test result: FAILED\. 0 passed; 1 failed;' "$log"
          done
      - name: Verify resolver locking with product identities and host feature unions
        if: fromJSON(needs.plan.outputs.selection).resolver
        shell: bash
        run: |
          set -euo pipefail
          script=.github/scripts/p2p/discovery/resolver/product.py
          if [[ "$RUNNER_OS" == Windows ]]; then host=x86_64-pc-windows-msvc; else host=x86_64-unknown-linux-gnu; fi
          cargo metadata --locked --format-version 1 --filter-platform "$host" > target/resolver-locking-baseline.json
          python -I "$script" create --source target/p2p/resolver/hickory-resolver-0.26.3 --baseline target/resolver-locking-baseline.json --lock Cargo.lock --destination target/resolver-locking-product
          features=$(python -I "$script" features --destination target/resolver-locking-product)
          cargo metadata --manifest-path target/resolver-locking-product/Cargo.toml --no-default-features --features "$features" --format-version 1 --filter-platform "$host" > target/resolver-locking-product/metadata.json
          python -I "$script" verify --baseline target/resolver-locking-baseline.json --lock Cargo.lock --destination target/resolver-locking-product
          log="$RUNNER_TEMP/shaar-resolver-product.log"
          bash .github/scripts/p2p/discovery/owned_dns/cargo.sh locking_ resolver-product "$log" hickory_resolver target/resolver-locking-product/src/lib.rs target normal --locked --target-dir target --manifest-path target/resolver-locking-product/Cargo.toml --no-default-features --features "$features" --lib
      - name: Verify no-cache contracts with the unchanged product feature union
        if: fromJSON(needs.plan.outputs.selection).resolver
        shell: bash
        run: |
          set -euo pipefail
          features=$(python -I .github/scripts/p2p/discovery/resolver/product.py features --destination target/resolver-locking-product)
          log="$RUNNER_TEMP/shaar-resolver-cache-product.log"
          bash .github/scripts/p2p/discovery/owned_dns/cargo.sh no_cache_ resolver-cache-product "$log" hickory_resolver target/resolver-locking-product/src/lib.rs target normal --locked --target-dir target --manifest-path target/resolver-locking-product/Cargo.toml --no-default-features --features "$features" --lib
      - name: Verify owned DNS foundation and its single product graph edge
        if: fromJSON(needs.plan.outputs.selection).dns
        shell: bash
        run: |
          set -euo pipefail
          script=.github/scripts/p2p/discovery/foundation/foundation.py
          if [[ "$RUNNER_OS" == Windows ]]; then host=x86_64-pc-windows-msvc; else host=x86_64-unknown-linux-gnu; fi
          python -I "$script" baseline --repository . --destination target/owned-dns-baseline
          cargo metadata --locked --manifest-path target/owned-dns-baseline/Cargo.toml --format-version 1 --filter-platform "$host" > target/owned-dns-baseline/metadata.json
          python -I "$script" verify --repository . --baseline target/owned-dns-baseline/metadata.json --product target/resolver-locking-baseline.json --receipt target/owned-dns-graph.json
          python -I .github/scripts/p2p/discovery/foundation/foundation_checks.py
          bash .github/scripts/p2p/discovery/owned_dns/run.sh
      - name: Verify private DNS wire input envelopes
        if: fromJSON(needs.plan.outputs.selection).dns
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/p2p/discovery/owned_dns/run.sh wire_dns_ wire-dns "$RUNNER_TEMP/shaar-wire-dns.log"
      - name: Verify strict discovery address scope and complete grammar
        if: fromJSON(needs.plan.outputs.selection).discovery
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/p2p/discovery/owned_dns/run.sh discovery_address_ discovery-address "$RUNNER_TEMP/shaar-discovery-address.log"
      - name: Verify owned destination role ledger boundaries
        if: fromJSON(needs.plan.outputs.selection).discovery
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/p2p/discovery/owned_dns/run.sh destination_roles_ destination-roles "$RUNNER_TEMP/shaar-destination-roles.log"
          bash .github/scripts/verify_infrastructure_registry.sh
      - name: Verify guarded DNS transport root pinning
        if: fromJSON(needs.plan.outputs.selection).discovery
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/p2p/discovery/owned_dns/run.sh destination_guard_ destination-guard "$RUNNER_TEMP/shaar-destination-guard.log"
      - name: Verify carrier role-integration wiring
        if: fromJSON(needs.plan.outputs.selection).discovery
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/p2p/discovery/owned_dns/run.sh carrier_destination_ carrier-destination "$RUNNER_TEMP/shaar-carrier-destination.log"
      - name: Preserve owned relay revocation proof receipts
        if: always() && fromJSON(needs.plan.outputs.selection).relay
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: relay-operation-proof-${{ matrix.os }}
          path: |
            target/p2p/relay/provenance.json
            target/relay-operation-wire/product-metadata.json
            target/relay-operation-wire/run-receipt.json
            target/relay-operation-wire/*/fixture-provenance.json
            target/relay-operation-wire/*/graph-receipt.json
            target/relay-operation-wire/*/metadata.json
            target/relay-operation-wire/*/Cargo.lock
            target/relay-operation-wire/*/compile.jsonl
            target/relay-operation-wire/*/compile-failure.log
            target/relay-operation-wire/*/run.log
          if-no-files-found: warn
      - name: Preserve owned DNS foundation proof receipts
        if: always() && (fromJSON(needs.plan.outputs.selection).dns || fromJSON(needs.plan.outputs.selection).discovery)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: owned-dns-foundation-${{ matrix.os }}
          path: |
            target/owned-dns-graph.json
            target/owned-dns-baseline/metadata.json
            target/owned-dns-baseline/Cargo.lock
            target/resolver-locking-baseline.json
            ${{ runner.temp }}/shaar-owned-dns.log
            ${{ runner.temp }}/shaar-inventory-owned-dns/*.log
            ${{ runner.temp }}/shaar-wire-dns.log
            ${{ runner.temp }}/shaar-discovery-address.log
            ${{ runner.temp }}/shaar-destination-roles.log
            ${{ runner.temp }}/shaar-destination-guard.log
            ${{ runner.temp }}/shaar-carrier-destination.log
          if-no-files-found: warn
      - name: Preserve resolver locking and cache proof receipts
        if: always() && fromJSON(needs.plan.outputs.selection).resolver
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: resolver-locking-proof-${{ matrix.os }}
          path: |
            target/p2p/resolver/provenance.json
            target/resolver-locking-archive/fixture-provenance.json
            target/resolver-locking-archive/Cargo.lock
            target/resolver-locking-counterfactual-*/fixture-provenance.json
            target/resolver-locking-baseline.json
            target/resolver-locking-product/fixture-provenance.json
            target/resolver-locking-product/metadata.json
            target/resolver-locking-product/graph-receipt.json
            target/resolver-locking-product/Cargo.lock
            ${{ runner.temp }}/shaar-resolver-*.log
          if-no-files-found: warn
      - name: Verify Kademlia internal retention with the unchanged archive lock
        if: fromJSON(needs.plan.outputs.selection).kad
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/shaar-kad-retention.log"
          bash .github/scripts/p2p/discovery/owned_dns/cargo.sh retention_ kad-retention "$log" libp2p_kad target/kad-retention/libp2p-kad-0.49.0/src/lib.rs target/kad-retention/libp2p-kad-0.49.0/target normal --locked --manifest-path target/kad-retention/libp2p-kad-0.49.0/Cargo.toml --lib
      - name: Verify DNS expansion with the unchanged archive lock
        if: fromJSON(needs.plan.outputs.selection).dns
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/shaar-dns-retention.log"
          bash .github/scripts/p2p/discovery/owned_dns/cargo.sh retention_ dns-retention "$log" libp2p_dns target/dns-retention/libp2p-dns-0.45.0/src/lib.rs target/dns-retention/libp2p-dns-0.45.0/target normal --locked --manifest-path target/dns-retention/libp2p-dns-0.45.0/Cargo.toml --lib
      - name: Verify ingress ownership and budget boundaries
