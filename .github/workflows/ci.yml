          python -I .github/scripts/p2p/graph.py verify --workspace target/p08/workspace --metadata target/p08/metadata.json --relay-source "$relay" --swarm-source "$swarm" --kad-source target/p2p/kad/libp2p-kad-0.49.0 --dns-source target/p2p/dns/libp2p-dns-0.45.0 --resolver-source target/p2p/resolver/hickory-resolver-0.26.3
