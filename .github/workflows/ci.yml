# Sha'ar Stack CI: formatting, lint, tests, structural limits.
# Note: the structural guard and its tests in CI run on tracked paths.
# `git ls-files` does not see new untracked files of the current task;
# after the integration commit all new files are checked normally.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      p08_graph:
        description: Resolve and compile the reviewed P08 candidate graph without changing the product lock
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: fmt+clippy+test+structure (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: "1.99.1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # Pin the Python version for stability of the guard and its tests.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install Rust 1.99.1
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      - name: Prepare reviewed production backend sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/backend-archives/noq target/backend-archives/iroh target/backend-archives/runtime
          curl --fail --location --max-time 120 \
            https://static.crates.io/crates/noq-proto/noq-proto-1.3.0.crate \
            --output target/backend-archives/noq/noq-proto.crate
          curl --fail --location --max-time 120 \
            https://static.crates.io/crates/iroh/iroh-1.3.0.crate \
            --output target/backend-archives/iroh/iroh.crate
          curl --fail --location --max-time 120 \
            https://static.crates.io/crates/noq/noq-1.3.0.crate \
            --output target/backend-archives/runtime/noq.crate
          python -I .github/scripts/backend/prepare.py \
            --noq-archive target/backend-archives/noq/noq-proto.crate \
            --iroh-archive target/backend-archives/iroh/iroh.crate \
            --runtime-archive target/backend-archives/runtime/noq.crate \
            --lock .github/probes/iroh-paths/Cargo.lock --destination target/backend
      - name: Prepare reviewed signaling dependencies and expiry controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/p2p/relay-archive target/p2p/swarm-archive
          curl --fail --location --max-time 120 --max-filesize 2097152 https://static.crates.io/crates/libp2p-relay/libp2p-relay-0.22.0.crate --output target/p2p/relay-archive/relay.crate
          curl --fail --location --max-time 120 --max-filesize 2097152 https://static.crates.io/crates/libp2p-swarm/libp2p-swarm-0.48.0.crate --output target/p2p/swarm-archive/swarm.crate
          python -I .github/scripts/p2p/prepare.py --archive target/p2p/relay-archive/relay.crate --destination target/p2p/relay --swarm-archive target/p2p/swarm-archive/swarm.crate --swarm-destination target/p2p/swarm
          python -I .github/scripts/p2p/checks.py
          if [[ "$RUNNER_OS" == Windows ]]; then binary="$RUNNER_TEMP/p2p-lease.exe"; else binary="$RUNNER_TEMP/p2p-lease"; fi
          rustc --edition 2024 --test -D warnings .github/scripts/p2p/lease.rs -o "$binary"
          "$binary"
      - name: Prepare reviewed DNS expansion boundary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/p2p/dns-archive
          curl --fail --location --max-time 120 --max-filesize 2097152 https://static.crates.io/crates/libp2p-dns/libp2p-dns-0.45.0.crate --output target/p2p/dns-archive/dns.crate
          python -I .github/scripts/p2p/discovery/dns/prepare.py prepare --archive target/p2p/dns-archive/dns.crate --destination target/p2p/dns
          python -I .github/scripts/p2p/discovery/dns/checks.py
          python -I .github/scripts/p2p/discovery/dns/prepare.py fixture --source target/p2p/dns/libp2p-dns-0.45.0 --destination target/dns-retention/libp2p-dns-0.45.0
      - name: Prepare reviewed resolver locking boundary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/p2p/resolver-archive
          curl --fail --location --max-time 120 --max-filesize 2097152 https://static.crates.io/crates/hickory-resolver/hickory-resolver-0.26.3.crate --output target/p2p/resolver-archive/resolver.crate
          script=.github/scripts/p2p/discovery/resolver
          rustfmt --edition 2021 --config skip_children=true --check "$script/tests/connections.rs" "$script/tests/cleanup.rs" "$script"/tests/cache/*.rs
          python -I "$script/prepare.py" --archive target/p2p/resolver-archive/resolver.crate --destination target/p2p/resolver
          python -I "$script/checks.py"
          python -I "$script/tests/cache/checks.py"
          python -I "$script/fixture.py" --source target/p2p/resolver/hickory-resolver-0.26.3 --destination target/resolver-locking-archive
          for mechanism in connections cleanup cache_constructor cache_positive cache_error cache_alias cache_storage; do
            python -I "$script/fixture.py" --source target/p2p/resolver/hickory-resolver-0.26.3 --destination "target/resolver-locking-counterfactual-$mechanism" --counterfactual "$mechanism"
          done
      - name: Prepare reviewed Kademlia referral retention
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/p2p/kad-archive
          curl --fail --location --max-time 120 --max-filesize 2097152 https://static.crates.io/crates/libp2p-kad/libp2p-kad-0.49.0.crate --output target/p2p/kad-archive/kad.crate
          python -I .github/scripts/p2p/discovery/kad/kad.py prepare --archive target/p2p/kad-archive/kad.crate --destination target/p2p/kad
          python -I .github/scripts/p2p/discovery/kad/kad_checks.py
          python -I .github/scripts/p2p/discovery/kad/kad.py fixture --source target/p2p/kad/libp2p-kad-0.49.0 --destination target/kad-retention/libp2p-kad-0.49.0
          cargo metadata --locked --format-version 1 > target/p2p/metadata.json
          python -I .github/scripts/p2p/graph.py verify --workspace . --baseline Cargo.lock --metadata target/p2p/metadata.json --relay-source target/p2p/relay/libp2p-relay-0.22.0 --swarm-source target/p2p/swarm/libp2p-swarm-0.48.0 --kad-source target/p2p/kad/libp2p-kad-0.49.0 --dns-source target/p2p/dns/libp2p-dns-0.45.0 --resolver-source target/p2p/resolver/hickory-resolver-0.26.3 --receipt target/p2p/graph-receipt.json
      - name: Verify 30 relay operation units, 3 wire cases and isolated counterfactuals
        shell: bash
        run: |
          set -euo pipefail
          python -I .github/scripts/p2p/relay/fixtures/wire/run.py --repository . --source target/p2p/relay/libp2p-relay-0.22.0 --destination target/relay-operation-wire
      - name: Verify Carrier protocol barrier and isolated guard counterfactual
        shell: bash
        run: |
          set -euo pipefail
          python -I .github/scripts/p2p/carrier-wire-proof/checks.py
          python -I .github/scripts/p2p/carrier-wire-proof/run.py --repository . --destination target/carrier-wire-proof
      - name: Preserve Carrier protocol proof receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: carrier-protocol-proof-${{ matrix.os }}
          path: |
            target/carrier-wire-proof/*.json
            target/carrier-wire-proof/*/*.json
            target/carrier-wire-proof/*/*.jsonl
            target/carrier-wire-proof/*/*.log
            target/carrier-wire-proof/*/workspace/Cargo.lock
          if-no-files-found: warn
      - name: Verify resolver locking with archive features and genuine counterfactuals
        shell: bash
        run: |
          set -euo pipefail
          for profile in plain tls; do
            extra=()
            count=12
            if [[ "$profile" == tls ]]; then extra=(--features tls-ring); count=14; fi
            log="$RUNNER_TEMP/shaar-resolver-$profile.log"
            if cargo test --locked --manifest-path target/resolver-locking-archive/Cargo.toml --lib locking_ "${extra[@]}" >"$log" 2>&1; then status=0; else status=$?; fi
            python -I -X utf8 .github/scripts/scan_identity_output.py "$log"
            cat "$log"
            if [[ "$status" -ne 0 ]]; then exit "$status"; fi
            grep -E "^test result: ok\\. $count passed; 0 failed;" "$log"
          done
          for mechanism in connections cleanup; do
            if [[ "$mechanism" == connections ]]; then
              test_name=name_server::locking_connections::transport_wait_releases_connections_and_wakes
              marker=CONNECTIONS_HELD_WHILE_WAITING
            else
              test_name=name_server_pool::locking_cleanup::last_shared_future_is_destroyed_after_unlock_and_can_reenter
              marker=FOREIGN_FUTURE_DROPPED_UNDER_LOCK
            fi
            log="$RUNNER_TEMP/shaar-resolver-counterfactual-$mechanism.log"
            if cargo test --locked --manifest-path "target/resolver-locking-counterfactual-$mechanism/Cargo.toml" --lib "$test_name" -- --exact >"$log" 2>&1; then status=0; else status=$?; fi
            python -I -X utf8 .github/scripts/scan_identity_output.py "$log"
            cat "$log"
            if [[ "$status" -eq 0 ]]; then printf 'Unfixed resolver unexpectedly passed\n'; exit 1; fi
            grep -Fx "test $test_name ... FAILED" "$log"
            grep -F "$marker" "$log"
            grep -E '^test result: FAILED\. 0 passed; 1 failed;' "$log"
          done
      - name: Verify zero-capacity cache contracts and isolated counterfactuals
        shell: bash
        run: |
          set -euo pipefail
          for profile in plain dnssec; do
            extra=()
            count=23
            if [[ "$profile" == dnssec ]]; then extra=(--features dnssec-ring,metrics,recursor,serde); count=28; fi
            log="$RUNNER_TEMP/shaar-resolver-cache-$profile.log"
            if cargo test --locked --manifest-path target/resolver-locking-archive/Cargo.toml --lib no_cache_ "${extra[@]}" >"$log" 2>&1; then status=0; else status=$?; fi
            python -I -X utf8 .github/scripts/scan_identity_output.py "$log"
            cat "$log"
            if [[ "$status" -ne 0 ]]; then exit "$status"; fi
            grep -E "^test result: ok\\. $count passed; 0 failed;" "$log"
          done
          for mechanism in cache_constructor cache_positive cache_error cache_alias cache_storage; do
            case "$mechanism" in
              cache_constructor)
                test_name=cache::no_cache_storage::zero_capacity_never_constructs_moka_and_clones_share_configuration
                marker=ZERO_CAPACITY_CONSTRUCTED_MOKA ;;
              cache_positive)
                test_name=caching_client::no_cache_client::positive_finalization_moves_all_nonempty_section_buffers
                marker=DISABLED_CACHE_COPIED_POSITIVE_MESSAGE ;;
              cache_error)
                test_name=caching_client::no_cache_client::error_finalization_skips_cache_clone_and_preserves_original_error
                marker=DISABLED_CACHE_CLONED_ERROR ;;
              cache_alias)
                test_name=caching_client::no_cache_client::alias_finalization_skips_cache_message_and_preserves_child_lookup
                marker=DISABLED_CACHE_BUILT_ALIAS_MESSAGE ;;
              cache_storage)
                test_name=cache::no_cache_storage::disabled_storage_skips_upsert_work_and_clear_is_harmless
                marker=DISABLED_CACHE_PERFORMED_STORAGE_WORK ;;
            esac
            log="$RUNNER_TEMP/shaar-resolver-counterfactual-$mechanism.log"
            fixture="target/resolver-locking-counterfactual-$mechanism"
            build="$fixture/target"
            if [[ -e "$build" ]]; then printf 'Counterfactual target must be fresh: %s\n' "$build"; exit 1; fi
            if cargo test --locked --verbose --target-dir "$build" --manifest-path "$fixture/Cargo.toml" --lib "$test_name" -- --exact >"$log" 2>&1; then status=0; else status=$?; fi
            python -I -X utf8 .github/scripts/scan_identity_output.py "$log"
            cat "$log"
            grep -E "Compiling hickory-resolver v0\\.26\\.3 .*resolver-locking-counterfactual-$mechanism" "$log"
            grep -E "Running .*resolver-locking-counterfactual-$mechanism.*hickory_resolver-" "$log"
            if [[ "$status" -eq 0 ]]; then printf 'Cache counterfactual unexpectedly passed\n'; exit 1; fi
            grep -Fx "test $test_name ... FAILED" "$log"
            grep -F "$marker" "$log"
            grep -E '^test result: FAILED\. 0 passed; 1 failed;' "$log"
          done
      - name: Verify resolver locking with product identities and host feature unions
        shell: bash
        run: |
          set -euo pipefail
          script=.github/scripts/p2p/discovery/resolver/product.py
          if [[ "$RUNNER_OS" == Windows ]]; then host=x86_64-pc-windows-msvc; else host=x86_64-unknown-linux-gnu; fi
          cargo metadata --locked --format-version 1 --filter-platform "$host" > target/resolver-locking-baseline.json
          python -I "$script" create --source target/p2p/resolver/hickory-resolver-0.26.3 --baseline target/resolver-locking-baseline.json --lock Cargo.lock --destination target/resolver-locking-product
          features=$(python -I "$script" features --destination target/resolver-locking-product)
          cargo metadata --manifest-path target/resolver-locking-product/Cargo.toml --no-default-features --features "$features" --format-version 1 --filter-platform "$host" > target/resolver-locking-product/metadata.json
          python -I "$script" verify --baseline target/resolver-locking-baseline.json --lock Cargo.lock --destination target/resolver-locking-product
          log="$RUNNER_TEMP/shaar-resolver-product.log"
          if cargo test --locked --target-dir target --manifest-path target/resolver-locking-product/Cargo.toml --no-default-features --features "$features" --lib locking_ >"$log" 2>&1; then status=0; else status=$?; fi
          python -I -X utf8 .github/scripts/scan_identity_output.py "$log"
          cat "$log"
          if [[ "$status" -ne 0 ]]; then exit "$status"; fi
          grep -E '^test result: ok\. 12 passed; 0 failed;' "$log"
      - name: Verify no-cache contracts with the unchanged product feature union
        shell: bash
        run: |
          set -euo pipefail
          features=$(python -I .github/scripts/p2p/discovery/resolver/product.py features --destination target/resolver-locking-product)
          count=23
          case ",$features," in *,metrics,*) count=$((count + 1));; esac
          case ",$features," in *,__dnssec,*) count=$((count + 4));; esac
          log="$RUNNER_TEMP/shaar-resolver-cache-product.log"
          if cargo test --locked --target-dir target --manifest-path target/resolver-locking-product/Cargo.toml --no-default-features --features "$features" --lib no_cache_ >"$log" 2>&1; then status=0; else status=$?; fi
          python -I -X utf8 .github/scripts/scan_identity_output.py "$log"
          cat "$log"
          if [[ "$status" -ne 0 ]]; then exit "$status"; fi
          grep -E "^test result: ok\\. $count passed; 0 failed;" "$log"
      - name: Verify owned DNS foundation and its single product graph edge
        shell: bash
        run: |
          set -euo pipefail
          script=.github/scripts/p2p/discovery/foundation.py
          if [[ "$RUNNER_OS" == Windows ]]; then host=x86_64-pc-windows-msvc; else host=x86_64-unknown-linux-gnu; fi
          python -I "$script" baseline --repository . --destination target/owned-dns-baseline
          cargo metadata --locked --manifest-path target/owned-dns-baseline/Cargo.toml --format-version 1 --filter-platform "$host" > target/owned-dns-baseline/metadata.json
          python -I "$script" verify --repository . --baseline target/owned-dns-baseline/metadata.json --product target/resolver-locking-baseline.json --receipt target/owned-dns-graph.json
          python -I .github/scripts/p2p/discovery/foundation_checks.py
          log="$RUNNER_TEMP/shaar-owned-dns.log"
          if cargo test -p shaar-p2p --lib --locked owned_dns_ >"$log" 2>&1; then status=0; else status=$?; fi
          python -I -X utf8 .github/scripts/scan_identity_output.py "$log"
          cat "$log"
          if [[ "$status" -ne 0 ]]; then exit "$status"; fi
          grep -E '^test result: ok\. 31 passed; 0 failed;' "$log"
      - name: Verify private DNS wire input envelopes
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/shaar-wire-dns.log"
          if cargo test -p shaar-p2p --lib --locked wire_dns_ >"$log" 2>&1; then status=0; else status=$?; fi
          python -I -X utf8 .github/scripts/scan_identity_output.py "$log"
          cat "$log"
          if [[ "$status" -ne 0 ]]; then exit "$status"; fi
          grep -E '^test result: ok\. 29 passed; 0 failed;' "$log"
      - name: Verify strict discovery address scope and complete grammar
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/shaar-discovery-address.log"
          if cargo test -p shaar-p2p --lib --locked discovery_address_ >"$log" 2>&1; then status=0; else status=$?; fi
          python -I -X utf8 .github/scripts/scan_identity_output.py "$log"
          cat "$log"
          if [[ "$status" -ne 0 ]]; then exit "$status"; fi
          grep -E '^test result: ok\. 16 passed; 0 failed;' "$log"
      - name: Verify owned destination role ledger boundaries
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/shaar-destination-roles.log"
          if cargo test -p shaar-p2p --lib --locked destination_roles_ >"$log" 2>&1; then status=0; else status=$?; fi
          python -I -X utf8 .github/scripts/scan_identity_output.py "$log"
          cat "$log"
          if [[ "$status" -ne 0 ]]; then exit "$status"; fi
          grep -E '^test result: ok\. 15 passed; 0 failed;' "$log"
          bash .github/scripts/verify_infrastructure_registry.sh
      - name: Verify guarded DNS transport root pinning
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/shaar-destination-guard.log"
          if cargo test -p shaar-p2p --lib --locked destination_guard_ >"$log" 2>&1; then status=0; else status=$?; fi
          python -I -X utf8 .github/scripts/scan_identity_output.py "$log"
          cat "$log"
          if [[ "$status" -ne 0 ]]; then exit "$status"; fi
          grep -E '^test result: ok\. 22 passed; 0 failed;' "$log"
      - name: Verify carrier role-integration wiring
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/shaar-carrier-destination.log"
          if cargo test -p shaar-p2p --lib --locked carrier_destination_ >"$log" 2>&1; then status=0; else status=$?; fi
          python -I -X utf8 .github/scripts/scan_identity_output.py "$log"
          cat "$log"
          if [[ "$status" -ne 0 ]]; then exit "$status"; fi
          grep -E '^test result: ok\. 33 passed; 0 failed;' "$log"
      - name: Preserve owned relay revocation proof receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: relay-operation-proof-${{ matrix.os }}
          path: |
            target/p2p/relay/provenance.json
            target/relay-operation-wire/product-metadata.json
            target/relay-operation-wire/run-receipt.json
            target/relay-operation-wire/*/fixture-provenance.json
            target/relay-operation-wire/*/graph-receipt.json
            target/relay-operation-wire/*/metadata.json
            target/relay-operation-wire/*/Cargo.lock
            target/relay-operation-wire/*/compile.jsonl
            target/relay-operation-wire/*/compile-failure.log
            target/relay-operation-wire/*/run.log
          if-no-files-found: warn
      - name: Preserve owned DNS foundation proof receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: owned-dns-foundation-${{ matrix.os }}
          path: |
            target/owned-dns-graph.json
            target/owned-dns-baseline/metadata.json
            target/owned-dns-baseline/Cargo.lock
            target/resolver-locking-baseline.json
            ${{ runner.temp }}/shaar-owned-dns.log
            ${{ runner.temp }}/shaar-wire-dns.log
            ${{ runner.temp }}/shaar-discovery-address.log
            ${{ runner.temp }}/shaar-destination-roles.log
            ${{ runner.temp }}/shaar-destination-guard.log
            ${{ runner.temp }}/shaar-carrier-destination.log
          if-no-files-found: warn
      - name: Preserve resolver locking and cache proof receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: resolver-locking-proof-${{ matrix.os }}
          path: |
            target/p2p/resolver/provenance.json
            target/resolver-locking-archive/fixture-provenance.json
            target/resolver-locking-archive/Cargo.lock
            target/resolver-locking-counterfactual-*/fixture-provenance.json
            target/resolver-locking-baseline.json
            target/resolver-locking-product/fixture-provenance.json
            target/resolver-locking-product/metadata.json
            target/resolver-locking-product/graph-receipt.json
            target/resolver-locking-product/Cargo.lock
            ${{ runner.temp }}/shaar-resolver-*.log
          if-no-files-found: warn
      - name: Verify Kademlia internal retention with the unchanged archive lock
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/shaar-kad-retention.log"
          if cargo test --locked --manifest-path target/kad-retention/libp2p-kad-0.49.0/Cargo.toml --lib retention_ >"$log" 2>&1; then
            status=0
          else
            status=$?
          fi
          if ! python -I -X utf8 .github/scripts/scan_identity_output.py "$log"; then exit 1; fi
          cat "$log"
          if [[ "$status" -ne 0 ]]; then exit "$status"; fi
          grep -E '^test result: ok\. 11 passed; 0 failed;' "$log"
      - name: Verify DNS expansion with the unchanged archive lock
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/shaar-dns-retention.log"
          if cargo test --locked --manifest-path target/dns-retention/libp2p-dns-0.45.0/Cargo.toml --lib retention_ >"$log" 2>&1; then
            status=0
          else
            status=$?
          fi
          if ! python -I -X utf8 .github/scripts/scan_identity_output.py "$log"; then exit 1; fi
          cat "$log"
          if [[ "$status" -ne 0 ]]; then exit "$status"; fi
          grep -E '^test result: ok\. 24 passed; 0 failed;' "$log"
      - name: Verify ingress ownership and budget boundaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/ingress-budget-tests
          rustc --edition 2024 --test -D warnings .github/scripts/backend/ingress_budget.rs --out-dir target/ingress-budget-tests
          binary=target/ingress-budget-tests/ingress_budget
          if [ "$RUNNER_OS" = Windows ]; then binary="$binary.exe"; fi
          "$binary"
      - name: Verify Noq fatal driver exit and cancellation
        shell: bash
        run: |
          set -euo pipefail
          script=.github/scripts/tests/noq_driver/prepare.py
          rustfmt --edition 2024 --check .github/scripts/tests/noq_driver/{suite,support,protocol,internals}.rs
          python -I "$script" archive --backend target/backend --destination target/noq-driver-archive
          python -I "$script" counterfactual --backend target/backend --destination target/noq-driver-counterfactual
          for package in noq noq-proto; do
            log="$RUNNER_TEMP/shaar-driver-$package.log"
            if cargo test --locked --target-dir target/noq-driver-build --manifest-path "target/noq-driver-archive/$package/Cargo.toml" --lib driver_failure:: >"$log" 2>&1; then status=0; else status=$?; fi
            python -I -X utf8 .github/scripts/scan_identity_output.py "$log"
            cat "$log"
            if [[ "$status" -ne 0 ]]; then exit "$status"; fi
            if [[ "$package" == noq ]]; then count=11; else count=4; fi
            grep -E "^test result: ok\\. $count passed; 0 failed;" "$log"
          done
          log="$RUNNER_TEMP/shaar-driver-counterfactual.log"
