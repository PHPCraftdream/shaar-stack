# Sha'ar Stack CI: formatting, lint, tests, structural limits.
# Note: the structural guard and its tests in CI run on tracked paths.
# `git ls-files` does not see new untracked files of the current task;
# after the integration commit all new files are checked normally.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: fmt+clippy+test+structure (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: "1.99.1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # Pin the Python version for stability of the guard and its tests.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install Rust 1.99.1
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      # --locked rejects mismatches with the lock graph without regenerating it.
      # Full test runs are executed only in CI.
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo test
        run: cargo test --workspace --locked
      - name: Record toolchain versions
        run: |
          rustc --version --verbose
          cargo --version
      - name: Structural limits
        run: python -I -X utf8 .github/scripts/check_structure.py
      - name: Structural guard tests
        run: python -I -X utf8 -m unittest discover -s .github/scripts/tests
