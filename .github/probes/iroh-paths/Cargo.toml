# Standalone probe package (NOT a workspace member).
# Verified dependency versions (see report):
# - iroh / iroh-base: https://github.com/n0-computer/iroh/tree/v1.3.0 (crates.io 1.3.0)
# - n0-watcher: https://crates.io/api/v1/crates/n0-watcher (1.0.0, matches iroh v1.3.0 lock)
# - noq/noq-proto/noq-udp: exact 1.3.0 family, matching iroh v1.3.0's tested source set
# - tokio: https://crates.io/api/v1/crates/tokio (1.54.1)
# - serde_json: https://crates.io/api/v1/crates/serde_json (1.0.154)
# - n0-error: https://crates.io/api/v1/crates/n0-error (1.0.1, matches iroh v1.3.0 lock)
[package]
name = "iroh-paths-probe"
version = "0.1.0"
edition = "2024"
publish = false

# Detach from any parent workspace.
[workspace]

[dependencies]
iroh = { version = "=1.3.0", default-features = false, features = [
    "tls-ring",
    "unstable-custom-transports",
    "qlog",
] }
iroh-base = { version = "=1.3.0", default-features = false, features = [
    "key",
    "relay",
] }
n0-error = "=1.0.1"
n0-watcher = "=1.0.0"
noq = { version = "=1.3.0", default-features = false }
noq-proto = { version = "=1.3.0", default-features = false }
noq-udp = { version = "=1.3.0", default-features = false }
serde_json = "=1.0.154"
tracing-subscriber = { version = "=0.3.20", default-features = false, features = [
    "fmt",
    "env-filter",
] }
tokio = { version = "=1.54.1", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "sync",
    "io-util",
    "net",
] }
